# ASCEND contract — intelligence
# Contracts-first: frontend mocks this file with Prism; CI compares the sidecar's emitted OpenAPI against it.
# Edit by PR only; see docs/contracts/README.md.
openapi: 3.1.0
info:
  title: ASCEND sidecar — intelligence
  version: 0.1.0
  description: 'The intelligence layer: deterministic engines that decide numbers (recovery-v2, prog-v1) and return
    every input of every number, so the app can show a Why for it. Owner: Jegatheesan (backend). The optional local
    model only phrases explanations; see ADR-0014, ADR-0015 and ADR-0016.'
  license:
    name: MIT
    identifier: MIT
servers:
- url: http://127.0.0.1:{port}
  description: Sidecar on localhost. Random port in the app; 8765 with --dev.
  variables:
    port:
      default: '8765'
security:
- launchToken: []
tags:
- name: intelligence
  description: 'The intelligence layer: deterministic engines that decide numbers (recovery-v2, prog-v1) and return
    every input of every number, so the app can show a Why for it'
paths:
  /intelligence/recovery:
    get:
      tags:
      - intelligence
      summary: Recovery
      description: 'recovery-v2 per muscle with every input of its readiness, the check-in used and the

        personal factor per muscle group (population value 1 until there is evidence).'
      operationId: recovery_intelligence_recovery_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecoveryOut'
      x-status: implemented
  /intelligence/progression/{exercise_id}:
    get:
      tags:
      - intelligence
      summary: Progression Target
      description: 'prog-v1: the next session''s target for one exercise, with the reason, a one-line

        why, the formula and every input.'
      operationId: progression_target_intelligence_progression__exercise_id__get
      parameters:
      - name: exercise_id
        in: path
        required: true
        schema:
          type: integer
          title: Exercise Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TargetOut'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      x-status: implemented
  /intelligence/progression/{exercise_id}/decision:
    post:
      tags:
      - intelligence
      summary: Progression Decision
      description: 'Record "use it" or "keep mine" for the current target. "Keep mine" stops new

        targets for this exercise for 7 days (FT-1).'
      operationId: progression_decision_intelligence_progression__exercise_id__decision_post
      parameters:
      - name: exercise_id
        in: path
        required: true
        schema:
          type: integer
          title: Exercise Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DecisionIn'
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DecisionOut'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      x-status: implemented
  /intelligence/stalls:
    get:
      tags:
      - intelligence
      summary: Stalls
      description: Exercises trained in the last 14 days with no rep record in 3 sessions (prog-v1).
      operationId: stalls_intelligence_stalls_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/StalledLiftOut'
                type: array
                title: Response Stalls Intelligence Stalls Get
      x-status: implemented
components:
  schemas:
    CheckinUsed:
      properties:
        sleep:
          type: integer
          title: Sleep
        soreness:
          type: string
          title: Soreness
      type: object
      required:
      - sleep
      - soreness
      title: CheckinUsed
    DecisionIn:
      properties:
        choice:
          type: string
          enum:
          - accepted
          - kept
          title: Choice
      type: object
      required:
      - choice
      title: DecisionIn
    DecisionOut:
      properties:
        id:
          type: integer
          title: Id
        exercise_id:
          type: integer
          title: Exercise Id
        decided_at:
          type: string
          format: date-time
          title: Decided At
        choice:
          type: string
          title: Choice
        reason:
          type: string
          title: Reason
        kept_until:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Kept Until
        algo_version:
          type: string
          title: Algo Version
      type: object
      required:
      - id
      - exercise_id
      - decided_at
      - choice
      - reason
      - kept_until
      - algo_version
      title: DecisionOut
    E1rmOut:
      properties:
        unit:
          type: string
          enum:
          - kg
          - reps
          - s
          title: Unit
        current:
          anyOf:
          - type: number
          - type: 'null'
          title: Current
        best:
          anyOf:
          - type: number
          - type: 'null'
          title: Best
        last:
          anyOf:
          - type: number
          - type: 'null'
          title: Last
        trend_pct_week:
          anyOf:
          - type: number
          - type: 'null'
          title: Trend Pct Week
        series:
          items:
            $ref: '#/components/schemas/E1rmPoint'
          type: array
          title: Series
      type: object
      required:
      - unit
      - current
      - best
      - last
      - trend_pct_week
      - series
      title: E1rmOut
      description: 'Session performance: RIR-adjusted e1RM (kg) for loaded lifts, best reps for

        bodyweight moves, best seconds for holds.'
    E1rmPoint:
      properties:
        at:
          type: string
          format: date-time
          title: At
        value:
          type: number
          title: Value
      type: object
      required:
      - at
      - value
      title: E1rmPoint
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    MuscleRecoveryOut:
      properties:
        key:
          type: string
          title: Key
        label:
          type: string
          title: Label
        group:
          type: string
          title: Group
        status:
          type: string
          title: Status
        readiness:
          type: number
          title: Readiness
        readiness_population:
          type: number
          title: Readiness Population
        fatigue:
          type: number
          title: Fatigue
        capacity:
          type: number
          title: Capacity
        half_life_h:
          type: number
          title: Half Life H
        prior_half_life_h:
          type: number
          title: Prior Half Life H
        k:
          type: number
          title: K
        modifier:
          type: number
          title: Modifier
        es_7d:
          type: number
          title: Es 7D
        ready_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Ready At
        last_trained:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Last Trained
        top_sets:
          items:
            $ref: '#/components/schemas/TopSet'
          type: array
          title: Top Sets
        why:
          $ref: '#/components/schemas/Why'
      type: object
      required:
      - key
      - label
      - group
      - status
      - readiness
      - readiness_population
      - fatigue
      - capacity
      - half_life_h
      - prior_half_life_h
      - k
      - modifier
      - es_7d
      - ready_at
      - last_trained
      - top_sets
      - why
      title: MuscleRecoveryOut
    RecoveryGroupOut:
      properties:
        group:
          type: string
          title: Group
        k:
          type: number
          title: K
        k_low:
          type: number
          title: K Low
        k_high:
          type: number
          title: K High
        n:
          type: integer
          title: N
        personal:
          type: boolean
          title: Personal
        alpha:
          anyOf:
          - type: number
          - type: 'null'
          title: Alpha
        updated_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Updated At
      type: object
      required:
      - group
      - k
      - k_low
      - k_high
      - n
      - personal
      - alpha
      - updated_at
      title: RecoveryGroupOut
    RecoveryOut:
      properties:
        algo_version:
          type: string
          title: Algo Version
        formula:
          type: string
          title: Formula
        checkin:
          anyOf:
          - $ref: '#/components/schemas/CheckinUsed'
          - type: 'null'
        groups:
          items:
            $ref: '#/components/schemas/RecoveryGroupOut'
          type: array
          title: Groups
        muscles:
          items:
            $ref: '#/components/schemas/MuscleRecoveryOut'
          type: array
          title: Muscles
      type: object
      required:
      - algo_version
      - formula
      - checkin
      - groups
      - muscles
      title: RecoveryOut
      description: 'GET /intelligence/recovery: every muscle with its inputs, and the personal factors.'
    SkillGoalOut:
      properties:
        skill_name:
          type: string
          title: Skill Name
        step_name:
          type: string
          title: Step Name
        criterion:
          type: string
          title: Criterion
        sessions_met:
          type: integer
          title: Sessions Met
        confirm_sessions:
          type: integer
          title: Confirm Sessions
      type: object
      required:
      - skill_name
      - step_name
      - criterion
      - sessions_met
      - confirm_sessions
      title: SkillGoalOut
    StalledLiftOut:
      properties:
        exercise_id:
          type: integer
          title: Exercise Id
        exercise:
          type: string
          title: Exercise
        sessions_flat:
          type: integer
          title: Sessions Flat
        best:
          anyOf:
          - type: number
          - type: 'null'
          title: Best
        unit:
          type: string
          enum:
          - kg
          - reps
          - s
          title: Unit
      type: object
      required:
      - exercise_id
      - exercise
      - sessions_flat
      - best
      - unit
      title: StalledLiftOut
    TargetOut:
      properties:
        exercise_id:
          type: integer
          title: Exercise Id
        exercise:
          type: string
          title: Exercise
        kind:
          type: string
          enum:
          - reps
          - hold
          - none
          title: Kind
        sets:
          type: integer
          title: Sets
        reps:
          anyOf:
          - type: integer
          - type: 'null'
          title: Reps
        seconds:
          anyOf:
          - type: integer
          - type: 'null'
          title: Seconds
        weight_kg:
          type: number
          title: Weight Kg
        rpe:
          anyOf:
          - type: number
          - type: 'null'
          title: Rpe
        change:
          type: string
          title: Change
        reason:
          type: string
          title: Reason
        why:
          type: string
          title: Why
        explanation:
          $ref: '#/components/schemas/Why'
        rep_range:
          anyOf:
          - items:
              type: integer
            type: array
          - type: 'null'
          title: Rep Range
        increment_kg:
          anyOf:
          - type: number
          - type: 'null'
          title: Increment Kg
        e1rm:
          anyOf:
          - $ref: '#/components/schemas/E1rmOut'
          - type: 'null'
        stalled:
          type: boolean
          title: Stalled
        stall_sessions:
          type: integer
          title: Stall Sessions
        skill:
          anyOf:
          - $ref: '#/components/schemas/SkillGoalOut'
          - type: 'null'
        readiness:
          anyOf:
          - type: number
          - type: 'null'
          title: Readiness
        kept_until:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Kept Until
        deload_week:
          type: boolean
          title: Deload Week
        phrasing:
          type: string
          enum:
          - template
          - model
          title: Phrasing
          default: template
        algo_version:
          type: string
          title: Algo Version
      type: object
      required:
      - exercise_id
      - exercise
      - kind
      - sets
      - reps
      - seconds
      - weight_kg
      - rpe
      - change
      - reason
      - why
      - explanation
      - rep_range
      - increment_kg
      - e1rm
      - stalled
      - stall_sessions
      - skill
      - readiness
      - kept_until
      - deload_week
      - algo_version
      title: TargetOut
    TopSet:
      properties:
        exercise:
          type: string
          title: Exercise
        dose_now:
          type: number
          title: Dose Now
        hours_ago:
          type: number
          title: Hours Ago
      type: object
      required:
      - exercise
      - dose_now
      - hours_ago
      title: TopSet
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
        input:
          title: Input
        ctx:
          type: object
          title: Context
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
    Why:
      properties:
        formula:
          type: string
          title: Formula
        inputs:
          additionalProperties:
            anyOf:
            - type: number
            - type: integer
            - type: string
            - type: 'null'
          type: object
          title: Inputs
      type: object
      required:
      - formula
      - inputs
      title: Why
      description: 'The "Why?" of one number: the formula in words and every input with its value.'
  securitySchemes:
    launchToken:
      type: http
      scheme: bearer
      description: 'Per-launch random token from Electron main (dev: "dev").'
