# ASCEND contract — workouts
# Contracts-first: frontend mocks this file with Prism; CI compares the sidecar's emitted OpenAPI against it.
# Edit by PR only; see docs/contracts/README.md.
openapi: 3.1.0
info:
  title: ASCEND sidecar — workouts
  version: 0.1.0
  description: 'Workout logging, sets, exercises, PRs and plans. Owner: Jegatheesan (backend).


    Operations marked `x-status: implemented` match the v0.1 code skeleton exactly (generated from its OpenAPI on
    2026-10-20). `x-status: planned` operations are the agreed v1.0 design; they are additive and are mocked by
    Prism until implemented.'
  license:
    name: MIT
    identifier: MIT
servers:
- url: http://127.0.0.1:{port}
  description: Sidecar on localhost. Random port in the app; 8765 with --dev.
  variables:
    port:
      default: '8765'
security:
- launchToken: []
tags:
- name: workouts
  description: Shared logger for gym, calisthenics and cardio
paths:
  /workouts:
    post:
      tags:
      - workouts
      summary: Start
      operationId: start_workouts_post
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkoutOut'
      x-status: implemented
      parameters:
      - name: section
        in: query
        required: false
        schema:
          type: string
          enum:
          - gym
          - calisthenics
          - cardio
          - martial_arts
          - flexibility
          - meditation
          default: gym
      description: Start a session or return the running one. The first logged set decides the section.
    get:
      summary: List past workouts (newest first)
      operationId: list_workouts
      parameters:
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 100
          minimum: 1
          default: 20
          title: Limit
      - name: before
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Before
      - name: section
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Section
      - name: source
        in: query
        required: false
        schema:
          anyOf:
          - enum:
            - app
            - strong
            - hevy
            type: string
          - type: 'null'
          title: Source
      - name: since
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: date
          - type: 'null'
          description: First day to include
          title: Since
        description: First day to include
      - name: until
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: date
          - type: 'null'
          description: Last day to include
          title: Until
        description: Last day to include
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/WorkoutSummary'
      x-status: implemented
      tags:
      - workouts
      description: 'Newest first. Pass the last item''s started_at as `before` for the next page.

        Optional filters: section, source (app or an import) and a day range.'
  /workouts/active:
    get:
      tags:
      - workouts
      summary: Active
      operationId: active_workouts_active_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                anyOf:
                - $ref: '#/components/schemas/WorkoutOut'
                - type: 'null'
                title: Response Active Workouts Active Get
      x-status: implemented
  /workouts/{workout_id}:
    get:
      tags:
      - workouts
      summary: Get
      operationId: get_workouts__workout_id__get
      parameters:
      - name: workout_id
        in: path
        required: true
        schema:
          type: integer
          title: Workout Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkoutOut'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      x-status: implemented
  /workouts/{workout_id}/sets:
    post:
      tags:
      - workouts
      summary: Log Set
      operationId: log_set_workouts__workout_id__sets_post
      parameters:
      - name: workout_id
        in: path
        required: true
        schema:
          type: integer
          title: Workout Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetIn'
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoggedSet'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      x-status: implemented
      description: Lifts send weight_kg + reps; time-based sections (cardio, martial_arts, flexibility, meditation)
        must send duration_s (422 otherwise).
  /workouts/{workout_id}/finish:
    post:
      tags:
      - workouts
      summary: Finish
      operationId: finish_workouts__workout_id__finish_post
      parameters:
      - name: workout_id
        in: path
        required: true
        schema:
          type: integer
          title: Workout Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FinishedWorkout'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      x-status: implemented
  /exercises:
    get:
      summary: List Exercises
      description: 'The exercise library (gallery and logger). `q` matches names and aliases; the other

        filters narrow by logger section, a muscle region it trains (weight >= 0.5),

        equipment, difficulty, or user-added (`custom=true`). Archived exercises are hidden.'
      operationId: list_exercises_exercises_get
      parameters:
      - name: q
        in: query
        required: false
        schema:
          type: string
          default: ''
          title: Q
      - name: section
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Section
      - name: muscle
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Muscle
      - name: equipment
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Equipment
      - name: difficulty
        in: query
        required: false
        schema:
          anyOf:
          - enum:
            - beginner
            - intermediate
            - expert
            type: string
          - type: 'null'
          title: Difficulty
      - name: custom
        in: query
        required: false
        schema:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Custom
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ExerciseOut'
                title: Response List Exercises Exercises Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      x-status: implemented
      tags:
      - workouts
  /workouts/{workout_id}/sets/{set_id}:
    patch:
      summary: Edit a logged set (re-runs PR, XP, muscle load via events)
      operationId: edit_set
      parameters:
      - name: workout_id
        in: path
        required: true
        schema:
          type: integer
      - name: set_id
        in: path
        required: true
        schema:
          type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetPatch'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SetOut'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      x-status: implemented
      tags:
      - workouts
      description: PRs for the exercise and the set's muscle load are re-derived; XP already awarded is kept (append-only
        ledger).
    delete:
      summary: Delete a logged set
      operationId: delete_set
      parameters:
      - name: workout_id
        in: path
        required: true
        schema:
          type: integer
      - name: set_id
        in: path
        required: true
        schema:
          type: integer
      responses:
        '204':
          description: Deleted
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      x-status: implemented
      tags:
      - workouts
  /prs:
    get:
      summary: Personal records
      operationId: list_prs
      parameters:
      - name: exercise_id
        in: query
        required: false
        schema:
          type: integer
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PROut'
      x-status: implemented
      tags:
      - workouts
  /plans/current:
    get:
      summary: The active training plan
      operationId: current_plan
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlanOut'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      x-status: planned
      tags:
      - workouts
  /deload:
    get:
      tags:
      - workouts
      summary: Is a deload due? (planned 3+1 or 2 of 4 reactive signals)
      operationId: deload_advice
      responses: &id001
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeloadOut'
      x-status: implemented
  /deload/start:
    post:
      tags:
      - workouts
      summary: 'Accept the deload: record this week as the deload week'
      operationId: start_deload
      responses: *id001
      x-status: implemented
  /exercises/{exercise_id}:
    get:
      summary: Get Exercise
      description: 'One exercise with its instructions, the source of each field, attribution for

        anything found online, the skill trees it belongs to and how often it was logged.'
      operationId: get_exercise_exercises__exercise_id__get
      parameters:
      - name: exercise_id
        in: path
        required: true
        schema:
          type: integer
          title: Exercise Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExerciseDetail'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      x-status: implemented
      tags:
      - workouts
components:
  securitySchemes:
    launchToken:
      type: http
      scheme: bearer
      description: 'Per-launch random token from Electron main (dev: "dev").'
  schemas:
    ExerciseOut:
      properties:
        id:
          type: integer
          title: Id
        name:
          type: string
          title: Name
        equipment:
          type: string
          title: Equipment
        section:
          type: string
          title: Section
          default: gym
        met:
          anyOf:
          - type: number
          - type: 'null'
          title: Met
        time_based:
          type: boolean
          title: Time Based
          default: false
        muscles:
          items:
            $ref: '#/components/schemas/MuscleWeight'
          type: array
          title: Muscles
        slug:
          anyOf:
          - type: string
          - type: 'null'
          title: Slug
        measure:
          type: string
          title: Measure
          default: reps
        difficulty:
          anyOf:
          - type: string
          - type: 'null'
          title: Difficulty
        pattern:
          type: string
          title: Pattern
          default: other
        image:
          anyOf:
          - type: string
          - type: 'null'
          title: Image
        source:
          type: string
          title: Source
          default: ascend
        is_custom:
          type: boolean
          title: Is Custom
          default: false
        aliases:
          items:
            type: string
          type: array
          title: Aliases
          default: []
      type: object
      required:
      - id
      - name
      - equipment
      - muscles
      title: ExerciseOut
    FinishedWorkout:
      properties:
        workout:
          $ref: '#/components/schemas/WorkoutOut'
        xp_awarded:
          type: integer
          title: Xp Awarded
        active_minutes:
          type: number
          title: Active Minutes
        hard_sets:
          type: integer
          title: Hard Sets
      type: object
      required:
      - workout
      - xp_awarded
      - active_minutes
      - hard_sets
      title: FinishedWorkout
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    LoggedSet:
      properties:
        set:
          $ref: '#/components/schemas/SetOut'
        xp_awarded:
          type: integer
          title: Xp Awarded
        previous_best_e1rm:
          anyOf:
          - type: number
          - type: 'null'
          title: Previous Best E1Rm
      type: object
      required:
      - set
      - xp_awarded
      - previous_best_e1rm
      title: LoggedSet
    MuscleWeight:
      properties:
        muscle:
          type: string
          title: Muscle
        weight:
          type: number
          title: Weight
      type: object
      required:
      - muscle
      - weight
      title: MuscleWeight
    SetIn:
      properties:
        exercise_id:
          type: integer
          title: Exercise Id
        weight_kg:
          type: number
          maximum: 500.0
          minimum: 0.0
          title: Weight Kg
          default: 0
        reps:
          type: integer
          maximum: 100.0
          minimum: 1.0
          title: Reps
          default: 1
        rpe:
          anyOf:
          - type: number
            maximum: 10.0
            minimum: 1.0
          - type: 'null'
          title: Rpe
        duration_s:
          type:
          - integer
          - 'null'
          minimum: 1
          maximum: 21600
        distance_m:
          type:
          - number
          - 'null'
          minimum: 0
        avg_hr:
          type:
          - integer
          - 'null'
          minimum: 30
          maximum: 230
      type: object
      required:
      - exercise_id
      title: SetIn
    SetOut:
      properties:
        id:
          type: integer
          title: Id
        exercise_id:
          type: integer
          title: Exercise Id
        exercise_name:
          type: string
          title: Exercise Name
        weight_kg:
          type: number
          title: Weight Kg
        reps:
          type: integer
          title: Reps
        rpe:
          anyOf:
          - type: number
          - type: 'null'
          title: Rpe
        duration_s:
          anyOf:
          - type: integer
          - type: 'null'
          title: Duration S
        distance_m:
          anyOf:
          - type: number
          - type: 'null'
          title: Distance M
        avg_hr:
          anyOf:
          - type: integer
          - type: 'null'
          title: Avg Hr
        e1rm:
          anyOf:
          - type: number
          - type: 'null'
          title: E1Rm
        is_pr:
          type: boolean
          title: Is Pr
        performed_at:
          type: string
          format: date-time
          title: Performed At
        measure:
          type: string
          title: Measure
          default: reps
      type: object
      required:
      - id
      - exercise_id
      - exercise_name
      - weight_kg
      - reps
      - rpe
      - e1rm
      - is_pr
      - performed_at
      title: SetOut
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
        input:
          title: Input
        ctx:
          type: object
          title: Context
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
    WorkoutOut:
      properties:
        id:
          type: integer
          title: Id
        day:
          type: string
          format: date
          title: Day
        section:
          type: string
          title: Section
          default: gym
        started_at:
          type: string
          format: date-time
          title: Started At
        finished_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Finished At
        sets:
          items:
            $ref: '#/components/schemas/SetOut'
          type: array
          title: Sets
        source:
          type: string
          title: Source
          default: app
        title:
          type: string
          title: Title
          default: ''
      type: object
      required:
      - id
      - day
      - started_at
      - finished_at
      - sets
      title: WorkoutOut
    WorkoutSummary:
      properties:
        id:
          type: integer
          title: Id
        day:
          type: string
          format: date
          title: Day
        section:
          type: string
          title: Section
          default: gym
        started_at:
          type: string
          format: date-time
          title: Started At
        finished_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Finished At
        sets:
          type: integer
          title: Sets
        volume_kg:
          type: number
          title: Volume Kg
        xp:
          type: integer
          title: Xp
        source:
          type: string
          title: Source
          default: app
        title:
          type: string
          title: Title
          default: ''
      type: object
      required:
      - id
      - day
      - started_at
      - finished_at
      - sets
      - volume_kg
      - xp
      title: WorkoutSummary
    SetPatch:
      type: object
      properties:
        weight_kg:
          type: number
          minimum: 0
          maximum: 500
        reps:
          type: integer
          minimum: 1
          maximum: 100
        rpe:
          type:
          - number
          - 'null'
          minimum: 1
          maximum: 10
        duration_s:
          type:
          - integer
          - 'null'
          minimum: 1
        distance_m:
          type:
          - number
          - 'null'
          minimum: 0
    PROut:
      type: object
      properties:
        exercise_id:
          type: integer
        type:
          type: string
          enum:
          - e1rm
          - rm_n
          - volume
          - reps
          - hold
          - time
          - distance
        value:
          type: number
        formula:
          type:
          - string
          - 'null'
          enum:
          - epley
          - brzycki
          - null
        algo_version:
          type: string
        achieved_at:
          type: string
          format: date-time
        exercise:
          type: string
        weight_kg:
          type: number
        reps:
          type: integer
        set_id:
          type: integer
      required:
      - exercise_id
      - exercise
      - value
      - weight_kg
      - reps
      - algo_version
      - achieved_at
      - set_id
    PlanOut:
      type: object
      properties:
        id:
          type: integer
        source:
          type: string
          enum:
          - planner
          - imported
          - manual
        days:
          type: array
          items:
            type: object
            properties:
              weekday:
                type: integer
                minimum: 0
                maximum: 6
              focus:
                type: string
              items:
                type: array
                items:
                  type: object
                  properties:
                    exercise_id:
                      type: integer
                    sets:
                      type: integer
                    rep_low:
                      type: integer
                    rep_high:
                      type: integer
                    target_rpe:
                      type: number
                    rest_s:
                      type: integer
      required:
      - id
      - source
      - days
    Error:
      type: object
      required:
      - detail
      properties:
        detail:
          type: string
          description: Plain-language error, safe to show
        code:
          type: string
          description: Stable machine code, e.g. SIDECAR_UNAVAILABLE, MODEL_MISSING
    DeloadSignal:
      type: object
      properties:
        code:
          type: string
          enum:
          - LOW_READINESS
          - HEAVY_SORENESS
          - PERFORMANCE_DROP
          - FATIGUE_BUILDUP
        active:
          type: boolean
        detail:
          type: string
      required:
      - code
      - active
      - detail
    DeloadOut:
      type: object
      properties:
        recommended:
          type: boolean
        kind:
          type: string
          enum:
          - planned
          - reactive
          - active
          - none
        training_weeks:
          type: integer
        signals:
          type: array
          items:
            $ref: '#/components/schemas/DeloadSignal'
        guidance:
          type:
          - string
          - 'null'
        deload_week:
          type:
          - string
          - 'null'
          format: date
        algo_version:
          type: string
          examples:
          - deload-v1
      required:
      - recommended
      - kind
      - training_weeks
      - signals
      - guidance
      - deload_week
      - algo_version
    AttributionOut:
      properties:
        source:
          type: string
          title: Source
        title:
          type: string
          title: Title
        url:
          type: string
          title: Url
        license:
          type: string
          title: License
      type: object
      required:
      - source
      - title
      - url
      - license
      title: AttributionOut
    ExerciseDetail:
      properties:
        id:
          type: integer
          title: Id
        name:
          type: string
          title: Name
        equipment:
          type: string
          title: Equipment
        section:
          type: string
          title: Section
          default: gym
        met:
          anyOf:
          - type: number
          - type: 'null'
          title: Met
        time_based:
          type: boolean
          title: Time Based
          default: false
        muscles:
          items:
            $ref: '#/components/schemas/MuscleWeight'
          type: array
          title: Muscles
        slug:
          anyOf:
          - type: string
          - type: 'null'
          title: Slug
        measure:
          type: string
          title: Measure
          default: reps
        difficulty:
          anyOf:
          - type: string
          - type: 'null'
          title: Difficulty
        pattern:
          type: string
          title: Pattern
          default: other
        image:
          anyOf:
          - type: string
          - type: 'null'
          title: Image
        source:
          type: string
          title: Source
          default: ascend
        is_custom:
          type: boolean
          title: Is Custom
          default: false
        aliases:
          items:
            type: string
          type: array
          title: Aliases
          default: []
        instructions:
          items:
            type: string
          type: array
          title: Instructions
          default: []
        mechanic:
          anyOf:
          - type: string
          - type: 'null'
          title: Mechanic
        rep_low:
          anyOf:
          - type: integer
          - type: 'null'
          title: Rep Low
        rep_high:
          anyOf:
          - type: integer
          - type: 'null'
          title: Rep High
        field_sources:
          additionalProperties:
            type: string
          type: object
          title: Field Sources
          default: {}
        attribution:
          items:
            $ref: '#/components/schemas/AttributionOut'
          type: array
          title: Attribution
          default: []
        source_ref:
          anyOf:
          - type: string
          - type: 'null'
          title: Source Ref
        created_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Created At
        skills:
          items:
            $ref: '#/components/schemas/SkillLinkOut'
          type: array
          title: Skills
          default: []
        sets_logged:
          type: integer
