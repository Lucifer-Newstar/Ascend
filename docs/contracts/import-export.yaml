# ASCEND contract — import-export
# Contracts-first: frontend mocks this file with Prism; CI compares the sidecar's emitted OpenAPI against it.
# Edit by PR only; see docs/contracts/README.md.
openapi: 3.1.0
info:
  title: ASCEND sidecar — import-export
  version: 0.1.0
  description: 'Imports (Strong/Hevy CSV, plan CSV), exports (CSV, JSON) and backups (.ascendbak). See ADR-0010.
    Owner: Jegatheesan; golden-file CI: Gokul.


    Operations marked `x-status: implemented` match the v0.1 code skeleton exactly (generated from its OpenAPI on
    2026-10-20). `x-status: planned` operations are the agreed v1.0 design; they are additive and are mocked by
    Prism until implemented.'
  license:
    name: MIT
    identifier: MIT
servers:
- url: http://127.0.0.1:{port}
  description: Sidecar on localhost. Random port in the app; 8765 with --dev.
  variables:
    port:
      default: '8765'
security:
- launchToken: []
tags:
- name: import-export
  description: Data portability
paths:
  /export/json:
    get:
      tags:
      - import-export
      summary: Export Json
      operationId: export_json_export_json_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties: true
                type: object
                title: Response Export Json Export Json Get
      x-status: implemented
  /export/csv/{kind}:
    get:
      tags:
      - import-export
      summary: Export Csv
      operationId: export_csv_export_csv__kind__get
      parameters:
      - name: kind
        in: path
        required: true
        schema:
          enum:
          - workouts
          - meals
          type: string
          title: Kind
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      x-status: implemented
  /import/strong:
    post:
      summary: Import a Strong CSV export (both header variants)
      description: 'Import a Strong CSV export (classic or 2025 layout). `dry_run` (default true)

        returns the report without writing anything.'
      operationId: import_strong_import_strong_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ImportIn'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImportReport'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      x-status: implemented
      tags:
      - import-export
  /import/hevy:
    post:
      summary: Import a Hevy CSV export
      description: Import a Hevy CSV export. `dry_run` (default true) only reports.
      operationId: import_hevy_import_hevy_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ImportIn'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImportReport'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      x-status: implemented
      tags:
      - import-export
  /import/plan:
    post:
      summary: Import your own plan (ASCEND plan CSV template)
      operationId: import_plan
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  contentMediaType: text/csv
                dry_run:
                  type: boolean
                  default: true
              required:
              - file
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImportReport'
      x-status: planned
      tags:
      - import-export
  /backup:
    post:
      summary: Create a .ascendbak (SQLite snapshot + photos + manifest)
      description: Write a .ascendbak (SQLite snapshot + manifest with SHA-256) to the backups folder.
      operationId: create_backup_backup_post
      requestBody:
        content:
          application/json:
            schema:
              anyOf:
              - $ref: '#/components/schemas/BackupIn'
              - type: 'null'
              title: Body
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BackupOut'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      x-status: implemented
      tags:
      - import-export
  /restore:
    post:
      summary: Restore from a .ascendbak (validates manifest + schema version first)
      description: 'Restore a .ascendbak over the current data. The current data is backed up first

        (reason "pre-restore"), so a mistaken restore can itself be undone.


        Only files in the backups folder are accepted (a bare file name means that folder);

        the database inside must pass PRAGMA integrity_check and carry no triggers or views.'
      operationId: restore_backup_restore_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RestoreIn'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RestoreOut'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      x-status: implemented
      tags:
      - import-export
  /backups:
    get:
      summary: List Backups
      description: Backups in the backups folder, newest first (manual and pre-migration).
      operationId: list_backups_backups_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/BackupOut'
                type: array
                title: Response List Backups Backups Get
      x-status: implemented
      tags:
      - import-export
  /data/erase:
    post:
      summary: Erase
      description: 'Delete the user''s data and keep the exercise library and food table ("start

        fresh"). A safety backup (reason "pre-erase") is written first, so it can be undone

        from Settings > Backups; an in-memory test database has none.'
      operationId: erase_data_erase_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EraseIn'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EraseOut'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      x-status: implemented
      tags:
      - import-export
components:
  securitySchemes:
    launchToken:
      type: http
      scheme: bearer
      description: 'Per-launch random token from Electron main (dev: "dev").'
  schemas:
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
        input:
          title: Input
        ctx:
          type: object
          title: Context
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
    ImportReport:
      properties:
        format:
          type: string
          enum:
          - strong_csv
          - strong_csv_2025
          - hevy_csv
          - ascend_plan_csv
          title: Format
        workouts:
          type: integer
          title: Workouts
        sets:
          type: integer
          title: Sets
        unmatched_exercises:
          items:
            type: string
          type: array
          title: Unmatched Exercises
          default: []
        warnings:
          items:
            type: string
          type: array
          title: Warnings
          default: []
        dry_run:
          type: boolean
          title: Dry Run
        skipped_duplicates:
          type: integer
          title: Skipped Duplicates
          default: 0
        skipped_warmups:
          type: integer
          title: Skipped Warmups
          default: 0
        matched_exercises:
          additionalProperties:
            type: string
          type: object
          title: Matched Exercises
          default: {}
      type: object
      required:
      - format
      - workouts
      - sets
      - dry_run
      title: ImportReport
    BackupOut:
      properties:
        path:
          type: string
          title: Path
        size_bytes:
          type: integer
          title: Size Bytes
        sha256:
          type: string
          title: Sha256
        created_at:
          type: string
          format: date-time
          title: Created At
        schema_revision:
          type: string
          title: Schema Revision
        app_version:
          type: string
          title: App Version
        reason:
          anyOf:
          - type: string
            enum:
            - manual
            - pre-migration
          - type: string
          title: Reason
          default: manual
        photos:
          type: integer
          title: Photos
          default: 0
        photos_included:
          type: boolean
          title: Photos Included
          default: true
      type: object
      required:
      - path
      - size_bytes
      - sha256
      - created_at
      - schema_revision
      - app_version
      title: BackupOut
    BackupIn:
      properties:
        password:
          anyOf:
          - type: string
          - type: 'null'
          title: Password
          description: Optional AES-256 password; not supported yet (422)
        include_photos:
          type: boolean
          title: Include Photos
          description: 'v1.2: false leaves the progress photos (files and rows) out of the backup'
          default: true
      additionalProperties: false
      type: object
      title: BackupIn
    RestoreIn:
      properties:
        path:
          type: string
          maxLength: 1024
          minLength: 1
          title: Path
        password:
          anyOf:
          - type: string
          - type: 'null'
          title: Password
      type: object
      required:
      - path
      title: RestoreIn
    Error:
      type: object
      required:
      - detail
      properties:
        detail:
          type: string
          description: Plain-language error, safe to show
        code:
          type: string
          description: Stable machine code, e.g. SIDECAR_UNAVAILABLE, MODEL_MISSING
    ImportIn:
      properties:
        csv:
          type: string
          maxLength: 20000000
          minLength: 1
          title: Csv
        dry_run:
          type: boolean
          title: Dry Run
          default: true
        unit:
          type: string
          enum:
          - kg
          - lb
          title: Unit
          description: Weight unit for Strong's 2025 export, which has no unit column
          default: kg
        include_warmups:
          type: boolean
          title: Include Warmups
          default: false
      type: object
      required:
      - csv
      title: ImportIn
      description: 'The CSV travels as text: renderer -> IPC -> main -> sidecar carries JSON only.'
    RestoreOut:
      properties:
        restored_from:
          type: string
          title: Restored From
        backup_created_at:
          type: string
          format: date-time
          title: Backup Created At
        schema_revision:
          type: string
          title: Schema Revision
        safety_backup:
          type: string
          title: Safety Backup
      type: object
      required:
      - restored_from
      - backup_created_at
      - schema_revision
      - safety_backup
      title: RestoreOut
    EraseIn:
      properties:
        confirm:
          type: string
          const: erase
          title: Confirm
        keep_preferences:
          type: boolean
          title: Keep Preferences
          default: true
      additionalProperties: false
      type: object
      required:
      - confirm
      title: EraseIn
      description: Erase the user's data. `confirm` must be the word "erase" (a typo guard).
    EraseOut:
      properties:
        erased:
          additionalProperties:
            type: integer
          type: object
          title: Erased
        safety_backup:
          anyOf:
          - type: string
          - type: 'null'
          title: Safety Backup
      type: object
      required:
      - erased
      - safety_backup
      title: EraseOut
