# ASCEND contract — import-export
# Contracts-first: frontend mocks this file with Prism; CI compares the sidecar's emitted OpenAPI against it.
# Edit by PR only; see docs/contracts/README.md.
openapi: 3.1.0
info:
  title: ASCEND sidecar — import-export
  version: 0.1.0
  description: 'Imports (Strong/Hevy CSV, plan CSV), exports (CSV, JSON) and backups (.ascendbak). See ADR-0010.
    Owner: Jegatheesan; golden-file CI: Gokul.


    Operations marked `x-status: implemented` match the v0.1 code skeleton exactly (generated from its OpenAPI on
    2026-10-20). `x-status: planned` operations are the agreed v1.0 design; they are additive and are mocked by
    Prism until implemented.'
  license:
    name: MIT
    identifier: MIT
servers:
- url: http://127.0.0.1:{port}
  description: Sidecar on localhost. Random port in the app; 8765 with --dev.
  variables:
    port:
      default: '8765'
security:
- launchToken: []
tags:
- name: import-export
  description: Data portability
paths:
  /export/json:
    get:
      tags:
      - import-export
      summary: Export Json
      operationId: export_json_export_json_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties: true
                type: object
                title: Response Export Json Export Json Get
      x-status: implemented
  /export/csv/{kind}:
    get:
      tags:
      - import-export
      summary: Export Csv
      operationId: export_csv_export_csv__kind__get
      parameters:
      - name: kind
        in: path
        required: true
        schema:
          enum:
          - workouts
          - meals
          type: string
          title: Kind
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      x-status: implemented
  /import/strong:
    post:
      summary: Import a Strong CSV export (both header variants)
      operationId: import_strong
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  contentMediaType: text/csv
                dry_run:
                  type: boolean
                  default: true
              required:
              - file
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImportReport'
      x-status: planned
      tags:
      - import-export
  /import/hevy:
    post:
      summary: Import a Hevy CSV export
      operationId: import_hevy
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  contentMediaType: text/csv
                dry_run:
                  type: boolean
                  default: true
              required:
              - file
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImportReport'
      x-status: planned
      tags:
      - import-export
  /import/plan:
    post:
      summary: Import your own plan (ASCEND plan CSV template)
      operationId: import_plan
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  contentMediaType: text/csv
                dry_run:
                  type: boolean
                  default: true
              required:
              - file
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImportReport'
      x-status: planned
      tags:
      - import-export
  /backup:
    post:
      summary: Create a .ascendbak (SQLite snapshot + photos + manifest)
      operationId: create_backup
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BackupIn'
      responses:
        '201':
          description: Backup written
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BackupOut'
      x-status: planned
      tags:
      - import-export
  /restore:
    post:
      summary: Restore from a .ascendbak (validates manifest + schema version first)
      operationId: restore_backup
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RestoreIn'
      responses:
        '200':
          description: Restored; app restarts the sidecar
        '422':
          description: Bad manifest, checksum or newer schema
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      x-status: planned
      tags:
      - import-export
components:
  securitySchemes:
    launchToken:
      type: http
      scheme: bearer
      description: 'Per-launch random token from Electron main (dev: "dev").'
  schemas:
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
        input:
          title: Input
        ctx:
          type: object
          title: Context
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
    ImportReport:
      type: object
      properties:
        format:
          type: string
          enum:
          - strong_csv
          - strong_csv_2025
          - hevy_csv
          - ascend_plan_csv
        workouts:
          type: integer
        sets:
          type: integer
        unmatched_exercises:
          type: array
          items:
            type: string
        warnings:
          type: array
          items:
            type: string
        dry_run:
          type: boolean
      required:
      - format
      - workouts
      - sets
      - dry_run
    BackupOut:
      type: object
      properties:
        path:
          type: string
        size_bytes:
          type: integer
        sha256:
          type: string
        created_at:
          type: string
          format: date-time
      required:
      - path
      - sha256
    BackupIn:
      type: object
      properties:
        password:
          type:
          - string
          - 'null'
          description: Optional AES-256 password; never logged
    RestoreIn:
      type: object
      properties:
        path:
          type: string
        password:
          type:
          - string
          - 'null'
      required:
      - path
    Error:
      type: object
      required:
      - detail
      properties:
        detail:
          type: string
          description: Plain-language error, safe to show
        code:
          type: string
          description: Stable machine code, e.g. SIDECAR_UNAVAILABLE, MODEL_MISSING
