# ASCEND contract — system
# Contracts-first: frontend mocks this file with Prism; CI compares the sidecar's emitted OpenAPI against it.
# Edit by PR only; see docs/contracts/README.md.
openapi: 3.1.0
info:
  title: ASCEND sidecar — system
  version: 0.1.0
  description: 'Health, lifecycle, background jobs, models and the SSE event stream.


    Operations marked `x-status: implemented` match the v0.1 code skeleton exactly (generated from its OpenAPI on
    2026-10-20). `x-status: planned` operations are the agreed v1.0 design; they are additive and are mocked by
    Prism until implemented.'
  license:
    name: MIT
    identifier: MIT
servers:
- url: http://127.0.0.1:{port}
  description: Sidecar on localhost. Random port in the app; 8765 with --dev.
  variables:
    port:
      default: '8765'
security:
- launchToken: []
tags:
- name: system
  description: Process lifecycle and cross-cutting endpoints
paths:
  /health:
    get:
      tags:
      - system
      summary: Health
      operationId: health_health_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties:
                  type: string
                type: object
                title: Response Health Health Get
      x-status: implemented
      security: []
      description: Open endpoint (no token) polled by the supervisor until ready.
  /shutdown:
    post:
      tags:
      - system
      summary: Shutdown
      description: Graceful stop requested by Electron main before it quits.
      operationId: shutdown_shutdown_post
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties:
                  type: string
                type: object
                title: Response Shutdown Shutdown Post
      x-status: implemented
  /jobs/{job_id}:
    get:
      summary: Job status
      operationId: get_job
      parameters:
      - name: job_id
        in: path
        required: true
        schema:
          type: integer
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobOut'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      x-status: planned
      tags:
      - system
    delete:
      summary: Cancel a job
      operationId: cancel_job
      parameters:
      - name: job_id
        in: path
        required: true
        schema:
          type: integer
      responses:
        '204':
          description: Cancelled
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      x-status: planned
      tags:
      - system
  /models:
    get:
      summary: Installed and available models (from the manifest)
      operationId: list_models
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ModelOut'
      x-status: planned
      tags:
      - system
  /models/{name}/download:
    post:
      summary: Start an opt-in model download (resumable, SHA-256 verified)
      operationId: download_model
      parameters:
      - name: name
        in: path
        required: true
        schema:
          type: string
      responses:
        '202':
          description: Download job queued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobOut'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      x-status: planned
      tags:
      - system
  /events:
    get:
      summary: Server-sent event stream (dashboard changes, job progress, chat tokens)
      operationId: event_stream
      parameters:
      - name: Last-Event-ID
        in: header
        required: false
        schema:
          type: string
      responses:
        '200':
          description: text/event-stream; each message is a ServerEvent
          content:
            text/event-stream:
              schema:
                $ref: '#/components/schemas/ServerEvent'
      x-status: planned
      tags:
      - system
components:
  securitySchemes:
    launchToken:
      type: http
      scheme: bearer
      description: 'Per-launch random token from Electron main (dev: "dev").'
  schemas:
    JobOut:
      type: object
      properties:
        id:
          type: integer
        type:
          type: string
          enum:
          - meal_scan
          - plan_generation
          - weekly_review
          - export
          - backup
          - model_download
        status:
          type: string
          enum:
          - queued
          - running
          - retrying
          - succeeded
          - failed
          - timed_out
          - cancelled
        progress:
          type: number
          minimum: 0
          maximum: 1
        result:
          type:
          - object
          - 'null'
        error:
          type:
          - string
          - 'null'
      required:
      - id
      - type
      - status
      - progress
    ModelOut:
      type: object
      properties:
        name:
          type: string
          examples:
          - qwen3:4b
        role:
          type: string
          enum:
          - coach
          - meal_items
          - lite
          - food_classifier
        runtime:
          type: string
          enum:
          - ollama
          - onnx
        size_bytes:
          type: integer
        licence:
          type: string
        min_vram_gb:
          type: number
        state:
          type: string
          enum:
          - missing
          - downloading
          - ready
          - error
        tokens_per_s:
          type:
          - number
          - 'null'
      required:
      - name
      - role
      - runtime
      - state
    ServerEvent:
      type: object
      properties:
        event:
          type: string
          enum:
          - dashboard.changed
          - job.progress
          - chat.token
          - chat.done
          - pr.achieved
          - level.up
          - quest.completed
          - model.status
        id:
          type: string
          description: ULID, usable as Last-Event-ID
        data:
          type: object
      required:
      - event
      - id
      - data
    Error:
      type: object
      required:
      - detail
      properties:
        detail:
          type: string
          description: Plain-language error, safe to show
        code:
          type: string
          description: Stable machine code, e.g. SIDECAR_UNAVAILABLE, MODEL_MISSING
