# ASCEND contract — schedule
# Contracts-first: frontend mocks this file with Prism; CI compares the sidecar's emitted OpenAPI against it.
# Edit by PR only; see docs/contracts/README.md.
openapi: 3.1.0
info:
  title: ASCEND sidecar — schedule
  version: 0.1.0
  description: 'Habit engine (v1.4, schedule-v1): your training weekdays and time, the week planned vs done (with
    a plan-the-week screen) and a 10-minute short session. Owner: Jegatheesan (backend).'
  license:
    name: MIT
    identifier: MIT
servers:
- url: http://127.0.0.1:{port}
  description: Sidecar on localhost. Random port in the app; 8765 with --dev.
  variables:
    port:
      default: '8765'
security:
- launchToken: []
tags:
- name: schedule
  description: Training schedule
paths:
  /schedule:
    get:
      tags:
      - schedule
      summary: Get Schedule
      description: Your training weekdays and time (or the followed program's suggested weekdays).
      operationId: get_schedule_schedule_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScheduleOut'
      x-status: implemented
    put:
      tags:
      - schedule
      summary: Put Schedule
      description: 'Pick your training weekdays and an optional time. The other weekdays become planned

        rest (neutral for the streak) from today on.'
      operationId: put_schedule_schedule_put
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ScheduleIn'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScheduleOut'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      x-status: implemented
  /schedule/week:
    get:
      tags:
      - schedule
      summary: Get Week
      description: 'Seven days from the Monday of ``start`` (default: this week): planned vs done, and

        the coming sessions lined up on the planned days.'
      operationId: get_week_schedule_week_get
      parameters:
      - name: start
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: date
          - type: 'null'
          title: Start
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WeekOut'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      x-status: implemented
    put:
      tags:
      - schedule
      summary: Put Week
      description: Plan one week (the Sunday plan-the-week screen). Past weeks cannot be changed.
      operationId: put_week_schedule_week_put
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WeekIn'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WeekOut'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      x-status: implemented
  /schedule/short-session:
    get:
      tags:
      - schedule
      summary: Get Short Session
      description: A short version of today's session (default 10 minutes), or null with no program.
      operationId: get_short_session_schedule_short_session_get
      parameters:
      - name: minutes
        in: query
        required: false
        schema:
          type: integer
          maximum: 30
          minimum: 5
          default: 10
          title: Minutes
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                anyOf:
                - $ref: '#/components/schemas/ShortSessionOut'
                - type: 'null'
                title: Response Get Short Session Schedule Short Session Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      x-status: implemented
components:
  securitySchemes:
    launchToken:
      type: http
      scheme: bearer
      description: Per-launch token from Electron main.
  schemas:
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    ScheduleIn:
      properties:
        days:
          items:
            type: integer
          type: array
          maxItems: 7
          minItems: 1
          title: Days
        time:
          anyOf:
          - type: string
          - type: 'null'
          title: Time
      additionalProperties: false
      type: object
      required:
      - days
      title: ScheduleIn
    ScheduleOut:
      properties:
        days:
          items:
            type: integer
          type: array
          title: Days
        time:
          anyOf:
          - type: string
          - type: 'null'
          title: Time
        source:
          type: string
          enum:
          - you
          - program
          - none
          title: Source
        label:
          type: string
          title: Label
        algo_version:
          type: string
          title: Algo Version
          default: schedule-v1
      type: object
      required:
      - days
      - time
      - source
      - label
      title: ScheduleOut
    ShortItemOut:
      properties:
        exercise_id:
          anyOf:
          - type: integer
          - type: 'null'
          title: Exercise Id
        exercise:
          type: string
          title: Exercise
        sets:
          type: integer
          title: Sets
        rep_low:
          type: integer
          title: Rep Low
        rep_high:
          type: integer
          title: Rep High
        rest_s:
          type: integer
          title: Rest S
        measure:
          type: string
          title: Measure
          default: reps
        section:
          anyOf:
          - type: string
          - type: 'null'
          title: Section
      type: object
      required:
      - exercise_id
      - exercise
      - sets
      - rep_low
      - rep_high
      - rest_s
      title: ShortItemOut
    ShortSessionOut:
      properties:
        session:
          type: string
          title: Session
        minutes:
          type: integer
          title: Minutes
        items:
          items:
            $ref: '#/components/schemas/ShortItemOut'
          type: array
          title: Items
        note:
          type: string
          title: Note
        algo_version:
          type: string
          title: Algo Version
          default: schedule-v1
      type: object
      required:
      - session
      - minutes
      - items
      - note
      title: ShortSessionOut
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
        input:
          title: Input
        ctx:
          type: object
          title: Context
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
    WeekDayOut:
      properties:
        day:
          type: string
          format: date
          title: Day
        weekday:
          type: integer
          title: Weekday
        planned:
          type: boolean
          title: Planned
        done:
          type: boolean
          title: Done
        session:
          anyOf:
          - type: string
          - type: 'null'
          title: Session
        today:
          type: boolean
          title: Today
        past:
          type: boolean
          title: Past
      type: object
      required:
      - day
      - weekday
      - planned
      - done
      - session
      - today
      - past
      title: WeekDayOut
    WeekIn:
      properties:
        week_start:
          type: string
          format: date
          title: Week Start
        days:
          items:
            type: integer
          type: array
          maxItems: 7
          title: Days
      additionalProperties: false
      type: object
      required:
      - week_start
      - days
      title: WeekIn
    WeekOut:
      properties:
        week_start:
          type: string
          format: date
          title: Week Start
        days:
          items:
            $ref: '#/components/schemas/WeekDayOut'
          type: array
          title: Days
        planned:
          type: integer
          title: Planned
        done:
          type: integer
          title: Done
        custom:
          type: boolean
          title: Custom
        source:
          type: string
          enum:
          - you
          - program
          - none
          title: Source
        algo_version:
          type: string
          title: Algo Version
          default: schedule-v1
      type: object
      required:
      - week_start
      - days
      - planned
      - done
      - custom
      - source
      title: WeekOut
