# ASCEND contract — actions
# Contracts-first: frontend mocks this file with Prism; CI compares the sidecar's emitted OpenAPI against it.
# Edit by PR only; see docs/contracts/README.md.
openapi: 3.1.0
info:
  title: ASCEND sidecar — actions
  version: 0.1.0
  description: 'In-app actions (actions-v1): one allowlist of typed actions over existing services, proposed by
    the chat, the command bar or the local model, confirmed by the user, audited and undoable. Owner: Jegatheesan
    (backend).'
  license:
    name: MIT
    identifier: MIT
servers:
- url: http://127.0.0.1:{port}
  description: Sidecar on localhost. Random port in the app; 8765 with --dev.
  variables:
    port:
      default: '8765'
security:
- launchToken: []
tags:
- name: actions
  description: In-app actions
paths:
  /actions:
    post:
      summary: Propose
      operationId: propose_actions_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProposeIn'
        required: true
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActionOut'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      x-status: implemented
      tags:
      - actions
  /actions/kinds:
    get:
      summary: Kinds
      description: 'The allowlist: every action the app can take for you (nothing else exists).'
      operationId: kinds_actions_kinds_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/KindOut'
                type: array
                title: Response Kinds Actions Kinds Get
      x-status: implemented
      tags:
      - actions
  /actions/auto:
    put:
      summary: Put Auto
      description: Let a low-risk action run without the confirm card ("always allow").
      operationId: put_auto_actions_auto_put
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AutoIn'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/KindOut'
                type: array
                title: Response Put Auto Actions Auto Put
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      x-status: implemented
      tags:
      - actions
  /actions/parse:
    post:
      summary: Parse
      description: 'Turn a sentence into a proposed action (rules first, the local model if on).

        Nothing changes until /actions/{id}/confirm.'
      operationId: parse_actions_parse_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ParseIn'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ParseOut'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      x-status: implemented
      tags:
      - actions
  /actions/{action_id}/confirm:
    post:
      summary: Confirm
      description: Run a proposed action (destructive ones need their word typed).
      operationId: confirm_actions__action_id__confirm_post
      parameters:
      - name: action_id
        in: path
        required: true
        schema:
          type: integer
          title: Action Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConfirmIn'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActionOut'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      x-status: implemented
      tags:
      - actions
  /actions/{action_id}/cancel:
    post:
      summary: Cancel
      operationId: cancel_actions__action_id__cancel_post
      parameters:
      - name: action_id
        in: path
        required: true
        schema:
          type: integer
          title: Action Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActionOut'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      x-status: implemented
      tags:
      - actions
  /actions/{action_id}/undo:
    post:
      summary: Undo
      operationId: undo_actions__action_id__undo_post
      parameters:
      - name: action_id
        in: path
        required: true
        schema:
          type: integer
          title: Action Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActionOut'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      x-status: implemented
      tags:
      - actions
  /actions/log:
    get:
      summary: Audit Log
      description: The last 50 actions with their outcome (the audit log).
      operationId: audit_log_actions_log_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/ActionOut'
                type: array
                title: Response Audit Log Actions Log Get
      x-status: implemented
      tags:
      - actions
components:
  securitySchemes:
    launchToken:
      type: http
      scheme: bearer
      description: Per-launch token from Electron main.
  schemas:
    ActionOut:
      properties:
        id:
          type: integer
          title: Id
        kind:
          type: string
          title: Kind
        label:
          type: string
          title: Label
        risk:
          type: string
          title: Risk
        params:
          additionalProperties: true
          type: object
          title: Params
        summary:
          items:
            type: string
          type: array
          title: Summary
        status:
          type: string
          title: Status
        source:
          type: string
          title: Source
        origin_text:
          anyOf:
          - type: string
          - type: 'null'
          title: Origin Text
        confirm_word:
          anyOf:
          - type: string
          - type: 'null'
          title: Confirm Word
        undoable:
          type: boolean
          title: Undoable
        auto_ok:
          type: boolean
          title: Auto Ok
        result:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Result
        error:
          anyOf:
          - type: string
          - type: 'null'
          title: Error
        created_at:
          type: string
          format: date-time
          title: Created At
        executed_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Executed At
        undone_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Undone At
      type: object
      required:
      - id
      - kind
      - label
      - risk
      - params
      - summary
      - status
      - source
      - origin_text
      - confirm_word
      - undoable
      - auto_ok
      - result
      - error
      - created_at
      - executed_at
      - undone_at
      title: ActionOut
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    ProposeIn:
      properties:
        kind:
          type: string
          enum:
          - log_set
          - log_hold
          - log_weight
          - log_meal
          - follow_program
          - erase_data
          title: Kind
        params:
          additionalProperties: true
          type: object
          title: Params
          default: {}
        source:
          type: string
          enum:
          - chat
          - command
          - trainer
          title: Source
          default: command
        text:
          anyOf:
          - type: string
            maxLength: 400
          - type: 'null'
          title: Text
      additionalProperties: false
      type: object
      required:
      - kind
      title: ProposeIn
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
        input:
          title: Input
        ctx:
          type: object
          title: Context
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
    AutoIn:
      properties:
        kind:
          type: string
          enum:
          - log_set
          - log_hold
          - log_weight
          - log_meal
          - follow_program
          - erase_data
          title: Kind
        allow:
          type: boolean
          title: Allow
      additionalProperties: false
      type: object
      required:
      - kind
      - allow
      title: AutoIn
    ConfirmIn:
      properties:
        typed:
          anyOf:
          - type: string
            maxLength: 20
          - type: 'null'
          title: Typed
      additionalProperties: false
      type: object
      title: ConfirmIn
    KindOut:
      properties:
        kind:
          type: string
          title: Kind
        label:
          type: string
          title: Label
        risk:
          type: string
          title: Risk
        undoable:
          type: boolean
          title: Undoable
        confirm_word:
          anyOf:
          - type: string
          - type: 'null'
          title: Confirm Word
        auto_ok:
          type: boolean
          title: Auto Ok
      type: object
      required:
      - kind
      - label
      - risk
      - undoable
      - confirm_word
      - auto_ok
      title: KindOut
    ParseIn:
      properties:
        text:
          type: string
          maxLength: 400
          minLength: 1
          title: Text
        source:
          type: string
          enum:
          - chat
          - command
          - trainer
          title: Source
          default: chat
      additionalProperties: false
      type: object
      required:
      - text
      title: ParseIn
    ParseOut:
      properties:
        proposal:
          anyOf:
          - $ref: '#/components/schemas/ActionOut'
          - type: 'null'
        error:
          anyOf:
          - type: string
          - type: 'null'
          title: Error
      type: object
      required:
      - proposal
      title: ParseOut
