# ASCEND contract — gamification
# Contracts-first: frontend mocks this file with Prism; CI compares the sidecar's emitted OpenAPI against it.
# Edit by PR only; see docs/contracts/README.md.
openapi: 3.1.0
info:
  title: ASCEND sidecar — gamification
  version: 0.1.0
  description: 'XP, levels, quests, streaks, freezes and ranks. Owner: Jegatheesan.


    Operations marked `x-status: implemented` match the v0.1 code skeleton exactly (generated from its OpenAPI on
    2026-10-20). `x-status: planned` operations are the agreed v1.0 design; they are additive and are mocked by
    Prism until implemented.'
  license:
    name: MIT
    identifier: MIT
servers:
- url: http://127.0.0.1:{port}
  description: Sidecar on localhost. Random port in the app; 8765 with --dev.
  variables:
    port:
      default: '8765'
security:
- launchToken: []
tags:
- name: gamification
  description: Humane game layer — XP is never taken away for missing a day; only a correction reverses its own
    grant (a deleted set, a PR edited away, a skill step whose proof was deleted), as a new negative ledger row
paths:
  /game/summary:
    get:
      tags:
      - gamification
      summary: Summary
      operationId: summary_game_summary_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GameSummary'
      x-status: implemented
  /game/quests/{item_id}/complete:
    post:
      tags:
      - gamification
      summary: Complete
      operationId: complete_game_quests__item_id__complete_post
      parameters:
      - name: item_id
        in: path
        required: true
        schema:
          type: integer
          title: Item Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuestItemOut'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      x-status: implemented
  /game/quests/{item_id}/swap:
    post:
      summary: Swap one quest item (once a day)
      operationId: swap_quest_item
      parameters:
      - name: item_id
        in: path
        required: true
        schema:
          type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QuestSwapIn'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuestItemOut'
        '409':
          description: Already swapped today
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      x-status: planned
      tags:
      - gamification
  /game/xp/history:
    get:
      summary: XP per day
      operationId: xp_history
      parameters:
      - name: days
        in: query
        required: false
        schema:
          type: integer
          default: 30
          maximum: 365
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/XpHistoryRow'
      x-status: planned
      tags:
      - gamification
  /game/rank:
    get:
      summary: Rank, title and next trial
      operationId: get_rank
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RankOut'
      x-status: planned
      tags:
      - gamification
  /game/mode:
    put:
      summary: Pause quests/streaks (sick, injury, travel, exam) up to 14 days
      operationId: set_mode
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ModeIn'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StreakOut'
      x-status: planned
      tags:
      - gamification
  /game/stats:
    get:
      summary: Hunter Stats
      description: STR, AGI, END, VIT and INT (0-100), each with its formula and inputs (stats-v1).
      operationId: hunter_stats_game_stats_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatsOut'
      x-status: implemented
      tags:
      - gamification
  /game/boss:
    get:
      summary: 'This week''s boss raid: HP, damage from logged sets, reward and title (boss-v1, ADR-0022)'
      operationId: boss_raid_game_boss_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BossOut'
      x-status: implemented
      tags:
      - gamification
  /game/titles:
    get:
      summary: Titles earned by beating weekly bosses, newest first (the only title source)
      operationId: titles_game_titles_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/TitleOut'
                type: array
                title: Response Titles Game Titles Get
      x-status: implemented
      tags:
      - gamification
  /game/themes:
    get:
      tags:
      - gamification
      summary: List Themes
      description: 'v1.2 app themes: Light, Dark and Shadow are free; the rest unlock from your record

        (best streak, rank, bosses beaten) and stay unlocked once earned.'
      operationId: list_themes_game_themes_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/ThemeOut'
                type: array
                title: Response List Themes Game Themes Get
      x-status: implemented
  /game/streak/reason:
    post:
      summary: Streak Reason
      description: 'v1.2: say why a day was missed. Given by the end of the next day, it keeps the

        streak; two missed days in a row still reset it.'
      operationId: streak_reason_game_streak_reason_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StreakReasonIn'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StreakOut'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      x-status: implemented
      tags:
      - gamification
  /game/bosses:
    get:
      summary: Boss Ladder
      description: 'The boss ladder (boss-v2): the twelve weekly bosses by tier, then the four seasonal

        ones. `beaten` counts your wins against each.'
      operationId: boss_ladder_game_bosses_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/BossLadderOut'
                type: array
                title: Response Boss Ladder Game Bosses Get
      x-status: implemented
      tags:
      - gamification
components:
  securitySchemes:
    launchToken:
      type: http
      scheme: bearer
      description: 'Per-launch random token from Electron main (dev: "dev").'
  schemas:
    GameSummary:
      properties:
        xp:
          $ref: '#/components/schemas/XpOut'
        streak:
          $ref: '#/components/schemas/StreakOut'
        quest:
          items:
            $ref: '#/components/schemas/QuestItemOut'
          type: array
          title: Quest
        calm:
          $ref: '#/components/schemas/CalmStreakOut'
      type: object
      required:
      - xp
      - streak
      - quest
      title: GameSummary
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    QuestItemOut:
      properties:
        id:
          type: integer
          title: Id
        day:
          type: string
          format: date
          title: Day
        kind:
          type: string
          title: Kind
        code:
          type: string
          title: Code
        title:
          type: string
          title: Title
        detail:
          type: string
          title: Detail
        metric:
          type: string
          title: Metric
        target:
          type: integer
          title: Target
        progress:
          type: integer
          title: Progress
        xp:
          type: integer
          title: Xp
        completed_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Completed At
      type: object
      required:
      - id
      - day
      - kind
      - code
      - title
      - detail
      - metric
      - target
      - progress
      - xp
      - completed_at
      title: QuestItemOut
    StreakOut:
      properties:
        current:
          type: integer
          title: Current
        best:
          type: integer
          title: Best
        excused:
          type: integer
          title: Excused
          default: 0
        active_today:
          type: boolean
          title: Active Today
        reason_due:
          anyOf:
          - type: string
            format: date
          - type: 'null'
          title: Reason Due
        rest_today:
          type: boolean
          title: Rest Today
          default: false
        lifetime_sessions:
          type: integer
          title: Lifetime Sessions
          default: 0
        next_milestone:
          anyOf:
          - type: integer
          - type: 'null'
          title: Next Milestone
          default: 1
        weeks_in_a_row:
          type: integer
          title: Weeks In A Row
          default: 0
        week_target:
          type: integer
          title: Week Target
          default: 3
      type: object
      required:
      - current
      - best
      - active_today
      title: StreakOut
      description: 'v1.2: a missed day is kept with a reason given by the next day (no more freezes).'
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
        input:
          title: Input
        ctx:
          type: object
          title: Context
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
    XpOut:
      properties:
        total:
          type: integer
          title: Total
        today:
          type: integer
          title: Today
        level:
          type: integer
          title: Level
        xp_into_level:
          type: integer
          title: Xp Into Level
        xp_for_next:
          type: integer
          title: Xp For Next
        rank:
          type: string
          title: Rank
        rank_title:
          type: string
          title: Rank Title
        daily_cap:
          type: integer
          title: Daily Cap
        formula_version:
          type: string
          title: Formula Version
        sub_rank:
          type: string
          title: Sub Rank
          default: E1
        next_sub_rank:
          anyOf:
          - type: string
          - type: 'null'
          title: Next Sub Rank
        next_sub_rank_level:
          anyOf:
          - type: integer
          - type: 'null'
          title: Next Sub Rank Level
      type: object
      required:
      - total
      - today
      - level
      - xp_into_level
      - xp_for_next
      - rank
      - rank_title
      - daily_cap
      - formula_version
      title: XpOut
    QuestSwapIn:
      type: object
      properties:
        replacement_kind:
          type: string
      required:
      - replacement_kind
    XpHistoryRow:
      type: object
      properties:
        day:
          type: string
          format: date
        xp:
          type: integer
        sources:
          type: object
          additionalProperties:
            type: integer
      required:
      - day
      - xp
    RankOut:
      type: object
      properties:
        rank:
          type: string
          enum:
          - E
          - D
          - C
          - B
          - A
          - S
        title:
          type: string
          examples:
          - Initiate
        level:
          type: integer
        next_rank_level:
          type:
          - integer
          - 'null'
        trial:
          type:
          - object
          - 'null'
      required:
      - rank
      - title
      - level
    ModeIn:
      type: object
      properties:
        mode:
          type: string
          enum:
          - normal
          - sick
          - injury
          - travel
          - exam
        days:
          type: integer
          minimum: 1
          maximum: 14
      required:
      - mode
    Error:
      type: object
      required:
      - detail
      properties:
        detail:
          type: string
          description: Plain-language error, safe to show
        code:
          type: string
          description: Stable machine code, e.g. SIDECAR_UNAVAILABLE, MODEL_MISSING
    CalmStreakOut:
      type: object
      properties:
        current:
          type: integer
        best:
          type: integer
        active_today:
          type: boolean
      required:
      - current
      - best
      - active_today
    StatOut:
      properties:
        key:
          type: string
          title: Key
        label:
          type: string
          title: Label
        value:
          type: integer
          title: Value
        formula:
          type: string
          title: Formula
        inputs:
          additionalProperties:
            anyOf:
            - type: number
            - type: integer
            - type: string
            - type: 'null'
          type: object
          title: Inputs
      type: object
      required:
      - key
      - label
      - value
      - formula
      - inputs
      title: StatOut
      description: One computed hunter stat (0-100) with the numbers behind it.
    StatsOut:
      properties:
        stats:
          items:
            $ref: '#/components/schemas/StatOut'
          type: array
          title: Stats
        version:
          type: string
          title: Version
        window_days:
          type: integer
          title: Window Days
      type: object
      required:
      - stats
      - version
      - window_days
      title: StatsOut
    BossOut:
      properties:
        week_start:
          type: string
          format: date
          title: Week Start
        week_end:
          type: string
          format: date
          title: Week End
        name:
          type: string
          title: Name
        title:
          type: string
          title: Title
        hp:
          type: integer
          title: Hp
        damage:
          type: integer
          title: Damage
        hp_left:
          type: integer
          title: Hp Left
        days_left:
          type: integer
          title: Days Left
        defeated:
          type: boolean
          title: Defeated
        defeated_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Defeated At
        bonus_xp:
          type: integer
          title: Bonus Xp
        hp_source:
          type: string
          title: Hp Source
        hp_note:
          type: string
          title: Hp Note
        titles_earned:
          type: integer
          title: Titles Earned
        algo_version:
          type: string
          title: Algo Version
        why:
          $ref: '#/components/schemas/BossWhy'
        tier:
          type: string
          title: Tier
          default: C
        category:
          type: string
          title: Category
          default: strength
        seasonal:
          type: boolean
          title: Seasonal
          default: false
        season:
          anyOf:
          - type: string
          - type: 'null'
          title: Season
        season_ends:
          anyOf:
          - type: string
            format: date
          - type: 'null'
          title: Season Ends
        drop:
          anyOf:
          - type: string
          - type: 'null'
          title: Drop
      type: object
      required:
      - week_start
      - week_end
      - name
      - title
      - hp
      - damage
      - hp_left
      - days_left
      - defeated
      - defeated_at
      - bonus_xp
      - hp_source
      - hp_note
      - titles_earned
      - algo_version
      - why
      title: BossOut
      description: 'GET /game/boss: this week''s boss raid (boss-v1, ADR-0022).'
    BossWhy:
      properties:
        formula:
          type: string
          title: Formula
        inputs:
          additionalProperties:
            anyOf:
            - type: integer
            - type: string
            - type: 'null'
          type: object
          title: Inputs
      type: object
      required:
      - formula
      - inputs
      title: BossWhy
    TitleOut:
      properties:
        title:
          type: string
          title: Title
        boss:
          type: string
          title: Boss
        week_start:
          type: string
          format: date
          title: Week Start
        earned_at:
          type: string
          format: date-time
          title: Earned At
      type: object
      required:
      - title
      - boss
      - week_start
      - earned_at
      title: TitleOut
      description: 'A title earned by beating a weekly boss: the only source of titles.'
    ThemeOut:
      properties:
        key:
          type: string
          title: Key
        name:
          type: string
          title: Name
        tagline:
          type: string
          title: Tagline
        free:
          type: boolean
          title: Free
        unlocked:
          type: boolean
          title: Unlocked
        requirement:
          type: string
          title: Requirement
        progress:
          type: string
          title: Progress
          default: ''
      type: object
      required:
      - key
      - name
      - tagline
      - free
      - unlocked
      - requirement
      title: ThemeOut
      description: 'v1.2: one app theme, whether it is free or earned, and how to earn it.'
    StreakReasonIn:
      properties:
        day:
          type: string
          format: date
          title: Day
        reason:
          type: string
          maxLength: 120
          minLength: 1
          title: Reason
      type: object
      required:
      - day
      - reason
      title: StreakReasonIn
    BossLadderOut:
      properties:
        name:
          type: string
          title: Name
        title:
          type: string
          title: Title
        tier:
          type: string
          title: Tier
        category:
          type: string
          title: Category
        min_level:
          type: string
          title: Min Level
        seasonal:
          type: boolean
          title: Seasonal
        season:
          anyOf:
          - type: string
          - type: 'null'
          title: Season
        months:
          items:
            type: integer
          type: array
          title: Months
        drop:
          anyOf:
          - type: string
          - type: 'null'
          title: Drop
        beaten:
          type: integer
          title: Beaten
      type: object
      required:
      - name
      - title
      - tier
      - category
      - min_level
      - seasonal
      - season
      - months
      - drop
      - beaten
      title: BossLadderOut
      description: 'GET /game/bosses: every boss, by tier and category, and how often you beat it.'
