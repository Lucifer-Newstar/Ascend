# ASCEND contract — progress
# Contracts-first: frontend mocks this file with Prism; CI compares the sidecar's emitted OpenAPI against it.
# Edit by PR only; see docs/contracts/README.md.
openapi: 3.1.0
info:
  title: ASCEND sidecar — progress
  version: 0.1.0
  description: 'Profile, settings, dashboard, muscle map, history, body metrics, ETA and readiness. Owner: Jegatheesan.


    Operations marked `x-status: implemented` match the v0.1 code skeleton exactly (generated from its OpenAPI on
    2026-10-20). `x-status: planned` operations are the agreed v1.0 design; they are additive and are mocked by
    Prism until implemented.'
  license:
    name: MIT
    identifier: MIT
servers:
- url: http://127.0.0.1:{port}
  description: Sidecar on localhost. Random port in the app; 8765 with --dev.
  variables:
    port:
      default: '8765'
security:
- launchToken: []
tags:
- name: progress
  description: Dashboard and progress data
paths:
  /profile:
    get:
      summary: Get Profile
      operationId: get_profile_profile_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfileOut'
      x-status: implemented
      tags:
      - progress
    put:
      summary: Put Profile
      operationId: put_profile_profile_put
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProfileIn'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfileOut'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      x-status: implemented
      tags:
      - progress
  /settings:
    get:
      summary: Get Settings
      operationId: get_settings_settings_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SettingsOut'
      x-status: implemented
      tags:
      - progress
    put:
      summary: Put Settings
      description: Partial update; omitted fields keep their stored value.
      operationId: put_settings_settings_put
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SettingsIn'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SettingsOut'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      x-status: implemented
      tags:
      - progress
  /muscles:
    get:
      tags:
      - progress
      summary: Muscles
      operationId: muscles_muscles_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/MuscleStateOut'
                type: array
                title: Response Muscles Muscles Get
      x-status: implemented
  /dashboard:
    get:
      tags:
      - progress
      summary: Dashboard
      operationId: dashboard_dashboard_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Dashboard'
      x-status: implemented
  /history:
    get:
      tags:
      - progress
      summary: Get History
      operationId: get_history_history_get
      parameters:
      - name: days
        in: query
        required: false
        schema:
          type: integer
          default: 30
          title: Days
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/HistoryDay'
                title: Response Get History History Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      x-status: implemented
  /muscles/{code}/history:
    get:
      tags:
      - progress
      summary: Muscle History
      description: 'Drill-down for one muscle: daily effective sets and readiness for 1-30 days,

        the sets that loaded it, and a plain-language suggestion from the status rules.'
      operationId: muscle_history_muscles__code__history_get
      parameters:
      - name: code
        in: path
        required: true
        schema:
          type: string
          title: Code
      - name: days
        in: query
        required: false
        schema:
          type: integer
          maximum: 30
          minimum: 1
          default: 7
          title: Days
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MuscleHistory'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      x-status: implemented
  /body-metrics:
    get:
      summary: Body metrics with trend weight
      operationId: list_body_metrics
      parameters:
      - name: days
        in: query
        required: false
        schema:
          type: integer
          default: 90
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BodyMetricOut'
      x-status: implemented
      tags:
      - progress
    post:
      summary: Log weight / measurements
      operationId: log_body_metric
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BodyMetricIn'
      responses:
        '201':
          description: Logged
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BodyMetricOut'
      x-status: implemented
      tags:
      - progress
  /progress/eta:
    get:
      summary: Estimated time to goal (range + confidence)
      operationId: eta
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EtaOut'
      x-status: implemented
      tags:
      - progress
  /checkins:
    post:
      summary: 20-second morning check-in → readiness; a re-submit the same day replaces it
      operationId: checkin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CheckinIn'
      responses:
        '201':
          description: Recorded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CheckinOut'
      x-status: implemented
      tags:
      - progress
    get:
      tags:
      - progress
      summary: Recent check-ins, oldest first
      operationId: list_checkins
      parameters:
      - name: days
        in: query
        required: false
        schema:
          type: integer
          default: 14
          minimum: 1
          maximum: 90
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CheckinOut'
      x-status: implemented
  /body-metrics/{metric_id}:
    delete:
      tags:
      - progress
      summary: Delete Body Metric
      operationId: delete_body_metric_body_metrics__metric_id__delete
      parameters:
      - name: metric_id
        in: path
        required: true
        schema:
          type: integer
          title: Metric Id
      responses:
        '204':
          description: Successful Response
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      x-status: implemented
  /measurements:
    get:
      tags:
      - progress
      summary: Tape measurements (optionally one site)
      operationId: list_measurements
      parameters:
      - name: site
        in: query
        required: false
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MeasurementOut'
      x-status: implemented
    post:
      tags:
      - progress
      summary: Log a tape measurement
      operationId: log_measurement
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MeasurementIn'
      responses:
        '201':
          description: Logged
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeasurementOut'
      x-status: implemented
  /progress/weekly:
    get:
      tags:
      - progress
      summary: Weekly training summary (Monday-start weeks, oldest first)
      operationId: progress_weekly
      parameters:
      - name: weeks
        in: query
        required: false
        schema:
          type: integer
          default: 8
          minimum: 1
          maximum: 52
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/WeekSummary'
      x-status: implemented
  /checkins/today:
    get:
      tags:
      - progress
      summary: Today's check-in, or null if skipped
      operationId: checkin_today
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                oneOf:
                - $ref: '#/components/schemas/CheckinOut'
                - type: 'null'
      x-status: implemented
  /muscles/activity:
    get:
      summary: Muscle Activity
      description: 'Per-muscle effective sets, attributed volume load and last-trained time over

        the last 1-30 days (the muscle map''s range switch and hover card).'
      operationId: muscle_activity_muscles_activity_get
      parameters:
      - name: days
        in: query
        required: false
        schema:
          type: integer
          maximum: 30
          minimum: 1
          default: 7
          title: Days
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MuscleActivity'
                title: Response Muscle Activity Muscles Activity Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      x-status: implemented
      tags:
      - progress
  /profile/baseline:
    post:
      summary: Post Baseline
      description: 'The onboarding baseline test: each result is logged as a max-effort set in one

        finished "Baseline test" session (so it earns XP and feeds the skill trees like any

        set), and the results are kept on the profile.'
      operationId: post_baseline_profile_baseline_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BaselineIn'
        required: true
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BaselineOut'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      x-status: implemented
      tags:
      - progress
  /progress/recap:
    get:
      summary: Progress Recap
      description: 'The weekly recap (v1.2): the week (Monday to Sunday) holding `week`, this week by

        default. Sessions, sets, minutes, records, XP, the boss and the streak; no body numbers.

        The desktop app turns it into a short video on this PC.'
      operationId: progress_recap_progress_recap_get
      parameters:
      - name: week
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: date
          - type: 'null'
          title: Week
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WeekRecap'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      x-status: implemented
      tags:
      - progress
components:
  securitySchemes:
    launchToken:
      type: http
      scheme: bearer
      description: 'Per-launch random token from Electron main (dev: "dev").'
  schemas:
    Dashboard:
      properties:
        date:
          type: string
          title: Date
        has_profile:
          type: boolean
          title: Has Profile
        rings:
          additionalProperties:
            $ref: '#/components/schemas/Ring'
          type: object
          title: Rings
        nutrition:
          $ref: '#/components/schemas/Totals'
        game:
          $ref: '#/components/schemas/GameSummary'
        muscles:
          items:
            $ref: '#/components/schemas/MuscleStateOut'
          type: array
          title: Muscles
      type: object
      required:
      - date
      - has_profile
      - rings
      - nutrition
      - game
      - muscles
      title: Dashboard
    EnergyTargets:
      properties:
        bmr:
          type: integer
          title: Bmr
        tdee:
          type: integer
          title: Tdee
        kcal_target:
          type: integer
          title: Kcal Target
        protein_target_g:
          type: integer
          title: Protein Target G
        formula_version:
          type: string
          title: Formula Version
        is_estimate:
          type: boolean
          title: Is Estimate
          default: true
      type: object
      required:
      - bmr
      - tdee
      - kcal_target
      - protein_target_g
      - formula_version
      title: EnergyTargets
    GameSummary:
      properties:
        xp:
          $ref: '#/components/schemas/XpOut'
        streak:
          $ref: '#/components/schemas/StreakOut'
        calm:
          $ref: '#/components/schemas/CalmStreakOut'
          default:
            current: 0
            best: 0
            active_today: false
        quest:
          items:
            $ref: '#/components/schemas/QuestItemOut'
          type: array
          title: Quest
      type: object
      required:
      - xp
      - streak
      - quest
      title: GameSummary
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    HistoryDay:
      properties:
        day:
          type: string
          format: date
          title: Day
        workouts:
          items:
            $ref: '#/components/schemas/WorkoutOut'
          type: array
          title: Workouts
        meals:
          items:
            $ref: '#/components/schemas/MealOut'
          type: array
          title: Meals
        kcal_in:
          type: number
          title: Kcal In
        sets:
          type: integer
          title: Sets
        xp:
          type: integer
          title: Xp
      type: object
      required:
      - day
      - workouts
      - meals
      - kcal_in
      - sets
      - xp
      title: HistoryDay
    MealItemOut:
      properties:
        id:
          type: integer
          title: Id
        food_id:
          type: integer
          title: Food Id
        food_name:
          type: string
          title: Food Name
        portions:
          type: number
          title: Portions
        kcal:
          type: number
          title: Kcal
        protein_g:
          type: number
          title: Protein G
        carbs_g:
          type: number
          title: Carbs G
        fat_g:
          type: number
          title: Fat G
      type: object
      required:
      - id
      - food_id
      - food_name
      - portions
      - kcal
      - protein_g
      - carbs_g
      - fat_g
      title: MealItemOut
    MealOut:
      properties:
        id:
          type: integer
          title: Id
        day:
          type: string
          format: date
          title: Day
        meal_type:
          type: string
          title: Meal Type
        logged_at:
          type: string
          format: date-time
          title: Logged At
        items:
          items:
            $ref: '#/components/schemas/MealItemOut'
          type: array
          title: Items
        kcal:
          type: number
          title: Kcal
      type: object
      required:
      - id
      - day
      - meal_type
      - logged_at
      - items
      - kcal
      title: MealOut
    MuscleStateOut:
      properties:
        key:
          type: string
          title: Key
        label:
          type: string
          title: Label
        group:
          type: string
          title: Group
        map_slug:
          type: string
          title: Map Slug
        status:
          type: string
          enum:
          - under
          - optimal
          - recovering
          - over
          - no_data
          title: Status
        es_7d:
          type: number
          title: Es 7D
        weekly_low:
          type: number
          title: Weekly Low
        weekly_high:
          type: number
          title: Weekly High
        readiness:
          type: number
          title: Readiness
        ready_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Ready At
        readiness_population:
          type: number
          title: Readiness Population
          default: 1.0
        algo_version:
          type: string
          title: Algo Version
          default: recovery-v2
        region:
          type: string
          title: Region
          default: ''
        parent:
          type: string
          title: Parent
          default: ''
        deep:
          type: boolean
          title: Deep
          default: false
        readiness_only:
          type: boolean
          title: Readiness Only
          default: false
      type: object
      required:
      - key
      - label
      - group
      - map_slug
      - status
      - es_7d
      - weekly_low
      - weekly_high
      - readiness
      - ready_at
      title: MuscleStateOut
    ProfileIn:
      properties:
        name:
          type: string
          maxLength: 80
          title: Name
          default: ''
        age:
          type: integer
          maximum: 100.0
          minimum: 13.0
          title: Age
        sex:
          type: string
          enum:
          - male
          - female
          title: Sex
        height_cm:
          type: number
          maximum: 250.0
          minimum: 100.0
          title: Height Cm
        weight_kg:
          type: number
          maximum: 300.0
          minimum: 30.0
          title: Weight Kg
        goal:
          type: string
          enum:
          - cut
          - maintain
          - bulk
          title: Goal
        activity:
          type: string
          enum:
          - sedentary
          - light
          - moderate
          - active
          - very_active
          title: Activity
          default: moderate
        target_weight_kg:
          anyOf:
          - type: number
            maximum: 300.0
            minimum: 30.0
          - type: 'null'
          title: Target Weight Kg
        focus:
          anyOf:
          - type: string
            enum:
            - strength
            - muscle
            - skills
            - fat_loss
          - type: 'null'
          title: Focus
        equipment:
          items:
            type: string
            enum:
            - none
            - pullup_bar
            - rings
            - dumbbells
            - bench
            - gym
          type: array
          maxItems: 6
          title: Equipment
        experience:
          anyOf:
          - type: string
            enum:
            - beginner
            - intermediate
            - advanced
          - type: 'null'
          title: Experience
      type: object
      required:
      - age
      - sex
      - height_cm
      - weight_kg
      - goal
      title: ProfileIn
    ProfileOut:
      properties:
        name:
          type: string
          maxLength: 80
          title: Name
          default: ''
        age:
          type: integer
          maximum: 100.0
          minimum: 13.0
          title: Age
        sex:
          type: string
          enum:
          - male
          - female
          title: Sex
        height_cm:
          type: number
          maximum: 250.0
          minimum: 100.0
          title: Height Cm
        weight_kg:
          type: number
          maximum: 300.0
          minimum: 30.0
          title: Weight Kg
        goal:
          type: string
          enum:
          - cut
          - maintain
          - bulk
          title: Goal
        activity:
          type: string
          enum:
          - sedentary
          - light
          - moderate
          - active
          - very_active
          title: Activity
          default: moderate
        target_weight_kg:
          anyOf:
          - type: number
            maximum: 300.0
            minimum: 30.0
          - type: 'null'
          title: Target Weight Kg
        focus:
          anyOf:
          - type: string
            enum:
            - strength
            - muscle
            - skills
            - fat_loss
          - type: 'null'
          title: Focus
        equipment:
          items:
            type: string
            enum:
            - none
            - pullup_bar
            - rings
            - dumbbells
            - bench
            - gym
          type: array
          maxItems: 6
          title: Equipment
        experience:
          anyOf:
          - type: string
            enum:
            - beginner
            - intermediate
            - advanced
          - type: 'null'
          title: Experience
        energy:
          $ref: '#/components/schemas/EnergyTargets'
        baseline:
          anyOf:
          - $ref: '#/components/schemas/BaselineResult'
          - type: 'null'
      type: object
      required:
      - age
      - sex
      - height_cm
      - weight_kg
      - goal
      - energy
      title: ProfileOut
    QuestItemOut:
      properties:
        id:
          type: integer
          title: Id
        day:
          type: string
          format: date
          title: Day
        kind:
          type: string
          title: Kind
        code:
          type: string
          title: Code
        title:
          type: string
          title: Title
        detail:
          type: string
          title: Detail
        metric:
          type: string
          title: Metric
        target:
          type: integer
          title: Target
        progress:
          type: integer
          title: Progress
        xp:
          type: integer
          title: Xp
        completed_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Completed At
      type: object
      required:
      - id
      - day
      - kind
      - code
      - title
      - detail
      - metric
      - target
      - progress
      - xp
      - completed_at
      title: QuestItemOut
    Ring:
      properties:
        value:
          type: number
          title: Value
        target:
          type: number
          title: Target
        label:
          type: string
          title: Label
        is_estimate:
          type: boolean
          title: Is Estimate
          default: false
      type: object
      required:
      - value
      - target
      - label
      title: Ring
    SetOut:
      properties:
        id:
          type: integer
          title: Id
        exercise_id:
          type: integer
          title: Exercise Id
        exercise_name:
          type: string
          title: Exercise Name
        weight_kg:
          type: number
          title: Weight Kg
        reps:
          type: integer
          title: Reps
        rpe:
          anyOf:
          - type: number
          - type: 'null'
          title: Rpe
        duration_s:
          anyOf:
          - type: integer
          - type: 'null'
          title: Duration S
        distance_m:
          anyOf:
          - type: number
          - type: 'null'
          title: Distance M
        avg_hr:
          anyOf:
          - type: integer
          - type: 'null'
          title: Avg Hr
        e1rm:
          anyOf:
          - type: number
          - type: 'null'
          title: E1Rm
        is_pr:
          type: boolean
          title: Is Pr
        performed_at:
          type: string
          format: date-time
          title: Performed At
        measure:
          type: string
          title: Measure
          default: reps
      type: object
      required:
      - id
      - exercise_id
      - exercise_name
      - weight_kg
      - reps
      - rpe
      - e1rm
      - is_pr
      - performed_at
      title: SetOut
    SettingsIn:
      properties:
        ai_enabled:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Ai Enabled
        units:
          anyOf:
          - type: string
            enum:
            - metric
            - imperial
          - type: 'null'
          title: Units
        theme:
          anyOf:
          - type: string
            enum:
            - dark
            - light
            - system
            - shadow
            - crimson
            - frost
            - emerald
            - solar
          - type: 'null'
          title: Theme
        sessions_per_week:
          anyOf:
