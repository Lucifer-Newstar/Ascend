# ASCEND contract — ai
# Contracts-first: frontend mocks this file with Prism; CI compares the sidecar's emitted OpenAPI against it.
# Edit by PR only; see docs/contracts/README.md.
openapi: 3.1.0
info:
  title: ASCEND sidecar — ai
  version: 0.1.0
  description: 'AI setup (ai-tiers-v1): detects Ollama and its pulled models, the RAM and NVIDIA VRAM of this PC,
    recommends a model or the rule-based tier, stores the chosen model and runs a timed test. Owner: Jegatheesan
    (backend).'
  license:
    name: MIT
    identifier: MIT
servers:
- url: http://127.0.0.1:{port}
  description: Sidecar on localhost. Random port in the app; 8765 with --dev.
  variables:
    port:
      default: '8765'
security:
- launchToken: []
tags:
- name: ai
  description: Local AI setup and tiers
paths:
  /ai/setup:
    get:
      summary: Get Setup
      description: 'Ollama installed/running, pulled models, RAM/VRAM, the recommended model (ai-tiers-v1)

        and the current tier. Tier "rules" is the full app without a model.'
      operationId: get_setup_ai_setup_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AiSetup'
      x-status: implemented
      tags:
      - ai
  /ai/model:
    put:
      summary: Put Model
      description: Pick the text model (it must be pulled in Ollama when Ollama is running).
      operationId: put_model_ai_model_put
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ModelIn'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AiSetup'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      x-status: implemented
      tags:
      - ai
  /ai/test:
    post:
      summary: Post Test
      description: Ask the model one short question and time it.
      operationId: post_test_ai_test_post
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TestOut'
      x-status: implemented
      tags:
      - ai
components:
  securitySchemes:
    launchToken:
      type: http
      scheme: bearer
      description: Per-launch token from Electron main.
  schemas:
    AiSetup:
      properties:
        ai_enabled:
          type: boolean
          title: Ai Enabled
        tier:
          type: string
          enum:
          - rules
          - ai
          title: Tier
        ollama_installed:
          type: boolean
          title: Ollama Installed
        ollama_running:
          type: boolean
          title: Ollama Running
        ollama_version:
          anyOf:
          - type: string
          - type: 'null'
          title: Ollama Version
        models:
          items:
            $ref: '#/components/schemas/ModelInfo'
          type: array
          title: Models
        model:
          type: string
          title: Model
        model_installed:
          type: boolean
          title: Model Installed
        recommended:
          $ref: '#/components/schemas/RecommendationOut'
        hardware:
          $ref: '#/components/schemas/HardwareOut'
        failures:
          type: integer
          title: Failures
        suggestion:
          anyOf:
          - type: string
          - type: 'null'
          title: Suggestion
        smaller_model:
          anyOf:
          - type: string
          - type: 'null'
          title: Smaller Model
        vision:
          $ref: '#/components/schemas/VisionOut'
        algo_version:
          type: string
          title: Algo Version
      type: object
      required:
      - ai_enabled
      - tier
      - ollama_installed
      - ollama_running
      - ollama_version
      - models
      - model
      - model_installed
      - recommended
      - hardware
      - failures
      - suggestion
      - smaller_model
      - vision
      - algo_version
      title: AiSetup
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    HardwareOut:
      properties:
        ram_gb:
          anyOf:
          - type: number
          - type: 'null'
          title: Ram Gb
        vram_gb:
          anyOf:
          - type: number
          - type: 'null'
          title: Vram Gb
        gpu:
          anyOf:
          - type: string
          - type: 'null'
          title: Gpu
      type: object
      required:
      - ram_gb
      - vram_gb
      - gpu
      title: HardwareOut
    ModelIn:
      properties:
        model:
          anyOf:
          - type: string
            maxLength: 80
            pattern: ^[A-Za-z0-9._:/-]+$
          - type: 'null'
          title: Model
      additionalProperties: false
      type: object
      title: ModelIn
    ModelInfo:
      properties:
        name:
          type: string
          title: Name
        size_gb:
          type: number
          title: Size Gb
      type: object
      required:
      - name
      - size_gb
      title: ModelInfo
    RecommendationOut:
      properties:
        model:
          anyOf:
          - type: string
          - type: 'null'
          title: Model
        size_gb:
          anyOf:
          - type: number
          - type: 'null'
          title: Size Gb
        reason:
          type: string
          title: Reason
        pull_command:
          anyOf:
          - type: string
          - type: 'null'
          title: Pull Command
      type: object
      required:
      - model
      - size_gb
      - reason
      - pull_command
      title: RecommendationOut
    TestOut:
      properties:
        ok:
          type: boolean
          title: Ok
        model:
          type: string
          title: Model
        seconds:
          type: number
          title: Seconds
        reason:
          anyOf:
          - type: string
          - type: 'null'
          title: Reason
        reply:
          type: string
          title: Reply
      type: object
      required:
      - ok
      - model
      - seconds
      - reason
      - reply
      title: TestOut
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
        input:
          title: Input
        ctx:
          type: object
          title: Context
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
    VisionOut:
      properties:
        model:
          type: string
          title: Model
        installed:
          type: boolean
          title: Installed
        pull_command:
          type: string
          title: Pull Command
      type: object
      required:
      - model
      - installed
      - pull_command
      title: VisionOut
