# Hyper-parameters read by the pipeline scripts (tracked by DVC, logged to MLflow).
prepare:
  image_size: 224   # model input after the centre crop (images are stored at short side 256)
  min_side: 64      # smaller images are dropped as unusable
  val_split: 0.15
  test_split: 0.15  # plus every team photo (test-own), which is always test
  seed: 42
train:
  backbone: mobilenet_v3_small
  pretrained: false   # true downloads ImageNet weights (use it for real data runs)
  epochs: 15
  batch_size: 32
  lr: 0.002
  weight_decay: 0.01
  label_smoothing: 0.05
export:
  version: 0.0.0-smoke   # bump per registered model (semver; -smoke = synthetic data)
