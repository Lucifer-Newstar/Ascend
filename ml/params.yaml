# Hyper-parameters read by the pipeline scripts (tracked by DVC, logged to MLflow).
prepare:
  image_size: 224   # model input after the centre crop (images are stored at short side 256)
  min_side: 64      # smaller images are dropped as unusable
  val_split: 0.15
  test_split: 0.15  # plus every team photo (test-own), which is always test
  seed: 42
train:
  # food-photo v0 recipe, sized for a laptop RTX 3050 (4 GB): MobileNetV3-Small at 224 px
  # uses about 1.5 GB at batch 64. Lower batch_size to 32 if CUDA runs out of memory.
  backbone: mobilenet_v3_small
  pretrained: true    # ImageNet weights (a 10 MB download); the CI smoke run sets false
  epochs: 20
  batch_size: 64
  lr: 0.001
  weight_decay: 0.01
  label_smoothing: 0.05
export:
  version: 0.1.0   # food-photo v0. A version containing "smoke" can never pass the gate
food_gate:
  # Judged on the team's own photos only (data/raw/_test-own, see food/README.md).
  min_own_per_class: 10   # own test photos per food class (shoot 30-50, split by meal)
  min_own_top1: 0.70
  min_own_top3: 0.90

# Trainer-chat intent router (intent/). Text only: trains on CPU in about a minute.
intent:
  data:
    seed: 42
    per_template: 8        # variants generated per app-command template
    val_frac: 0.1
    clinc_per_intent: 12   # CLINC150 rows kept per in-scope intent and split
    se_cap_per_label: 2500 # weak-labelled Stack Exchange titles kept per label
  train:
    word_ngrams: [1, 2]
    char_ngrams: [2, 5]
    max_word_features: 20000
    max_char_features: 40000
    min_df: 2
    sublinear_tf: true
    c_grid: [1.0, 4.0, 10.0]
  export:
    version: 1.0.0
    prune_below: 0.02      # coefficients smaller than this are dropped from the runtime file
    decimals: 3
  gate:
    min_templates_macro_f1: 0.80
    min_se_hand_accuracy: 0.60
    min_oos_recall: 0.85
    min_parity_argmax: 0.995
  threshold: 0.55          # the sidecar uses a prediction only at or above this confidence

# Knowledge base for the trainer's answers (knowledge/). BM25 lives in the sidecar.
knowledge:
  gate:
    min_hit_at_3: 0.9      # team-written app questions (app_questions.yaml)
