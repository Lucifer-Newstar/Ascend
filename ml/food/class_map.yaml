# Detection-dataset class name -> ASCEND label (ml/labels.json). Names are matched after
# lower-casing and turning spaces, dashes and dots into underscores, so "Medu Vada",
# "medu-vada" and "medu_vada" are one key.
#
# The block at the end ("Ascend.v1i.coco") is checked against the team's own Roboflow export:
# its 59 class names come from `coco_to_cls.py --list-classes` on Navin's PC (2026-10-26).
# The older entries above it are common spellings, not copied from each dataset.
# Before each conversion run
#     python food/src/coco_to_cls.py --list-classes <export folder>
# and add any real name you want to keep. Classes not listed here are skipped and counted
# in the report; nothing is guessed. Map a class to `skip` to drop it on purpose.
#
# Datasets (licences are on each Universe page; record the one you downloaded in
# ml/SOURCES.md before training):
#   bharani      universe.roboflow.com/bharani-1ucid/south-indian-food-detection
#   txofy        universe.roboflow.com/microplastics-vypxl/indian-food-txofy
#   indianfoodnet universe.roboflow.com/indianfoodnet/indianfoodnet (optional)

aliases:
