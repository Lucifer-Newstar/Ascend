  idly: idli
  idli_sambar: skip          # two foods in one box: ambiguous for a classifier
  dosa: dosa
  plain_dosa: dosa
  dosai: dosa
  masala_dosa: masala_dosa
  sambar: sambar
  sambhar: sambar
  chapati: chapati
