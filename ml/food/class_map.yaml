  plain_rice: rice
  satham: rice
  dal: dal
  dhal: dal
  daal: dal
  varan: dal                 # Maharashtrian plain toor dal
  toor_dal: dal
  medu_vada: medu_vada
  medu_vadai: medu_vada
  vada: medu_vada
  uzhunnu_vada: medu_vada
  pongal: ven_pongal
  ven_pongal: ven_pongal
  upma: upma
  rava_upma: upma
  poori: poori
  puri: poori
  parotta: parotta
  porotta: parotta
