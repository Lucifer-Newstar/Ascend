  chicken_curry: chicken_curry
  coconut_chutney: coconut_chutney
  thengai_chutney: coconut_chutney
  chutney: coconut_chutney   # check a sample: some datasets mix chutneys
  banana: banana
  # Common in these datasets but not food rows the app can log yet:
  salad: skip
  yogurt: skip
  curd: skip
  plate: skip

