# Dependabot opens weekly PRs for outdated dependencies. Grouped so the team gets
# a handful of PRs a week, not dozens. Each PR runs the full CI before merge.
version: 2
updates:
  # Python sidecar (uv.lock)
  - package-ecosystem: uv
    directory: /services/sidecar
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Asia/Kolkata
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    groups:
      python-dev-tools:
        dependency-type: development
      python-runtime:
        dependency-type: production
        update-types: [minor, patch]

  # npm workspaces (root package-lock.json covers apps/desktop and packages/shared)
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Asia/Kolkata
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    groups:
      react:
        patterns: ["react", "react-dom", "@types/react*"]
      lint-and-types:
        patterns: ["eslint*", "@eslint/*", "typescript*", "typescript-eslint", "globals"]
      build-tools:
        patterns: ["vite", "@vitejs/*", "vitest", "tailwindcss", "@tailwindcss/*"]
    ignore:
      # Electron majors change the security model; upgrade them deliberately.
      - dependency-name: electron
        update-types: ["version-update:semver-major"]
      # typescript-eslint 8 only supports TypeScript below 6.1 (its peer range), so
      # TypeScript 7 can't install cleanly yet. Drop this once typescript-eslint allows it.
      - dependency-name: typescript
        versions: [">=6.1.0"]

  # Base images in docker/ (python slim, uv). Monthly: base images move often and
  # each bump rebuilds every layer.
  - package-ecosystem: docker
    directory: /docker
    schedule:
      interval: monthly
    commit-message:
      prefix: "build(docker)"
    groups:
      base-images:
        patterns: ["*"]

  # ML pipeline requirements (Navin's lane). Training libraries are pinned loosely
  # on purpose; only security and patch updates are proposed.
  - package-ecosystem: pip
    directory: /ml
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    commit-message:
      prefix: "chore(ml-deps)"
    groups:
      ml:
        patterns: ["*"]
        update-types: [patch]

  # GitHub Actions used by the workflows
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "ci"
    groups:
      actions:
        patterns: ["*"]
