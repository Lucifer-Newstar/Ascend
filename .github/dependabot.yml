# Dependabot opens weekly PRs for outdated dependencies. Grouped so the team gets
# a handful of PRs a week, not dozens. Each PR runs the full CI before merge.
version: 2
updates:
  # Python sidecar (uv.lock)
  - package-ecosystem: uv
    directory: /services/sidecar
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Asia/Kolkata
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    groups:
      python-dev-tools:
        dependency-type: development
      python-runtime:
        dependency-type: production
        update-types: [minor, patch]

  # npm workspaces (root package-lock.json covers apps/desktop and packages/shared)
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Asia/Kolkata
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    groups:
      react:
        patterns: ["react", "react-dom", "@types/react*"]
      lint-and-types:
        patterns: ["eslint*", "@eslint/*", "typescript*", "typescript-eslint", "globals"]
      build-tools:
        patterns: ["vite", "@vitejs/*", "vitest", "tailwindcss", "@tailwindcss/*"]
    ignore:
      # Electron majors change the security model; upgrade them deliberately.
      - dependency-name: electron
        update-types: ["version-update:semver-major"]

  # GitHub Actions used by the workflows
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "ci"
