# Windows installer build.
#
# Runs on a version tag (v0.1.0, ...), on every push to main that touches the app
# (so main always has an installable artefact), or manually from the Actions tab.
# Steps: build the sidecar with PyInstaller on Windows, build the renderer +
# Electron code, then electron-builder packs both into an NSIS installer.
#
# On a version tag the installer is also published to a GitHub Release (the CD
# step), so anyone can download ASCEND-Setup from the repo's Releases page.
# On main and manual runs it stays a workflow artifact (Actions -> run -> Artifacts).
name: Release (Windows installer)

on:
  push:
    tags: ["v*"]
    branches: [main]
    paths:
      - "apps/desktop/**"
      - "services/sidecar/**"
      - "packages/shared/**"
      - "package-lock.json"
      - ".github/workflows/release.yml"
  workflow_dispatch:

concurrency:
  group: installer-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

permissions:
  contents: write   # needed to create the GitHub Release on version tags

jobs:
  windows-installer:
    strategy:
      matrix:
        os: [windows-latest]   # add windows-2022 etc. here to test more images
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: services/sidecar/uv.lock

      - name: Build sidecar (PyInstaller)
        working-directory: services/sidecar
        run: |
          uv sync --frozen --group build
          uv run --group build pyinstaller packaging/ascend-sidecar.spec --noconfirm

      - name: Smoke test sidecar.exe
        working-directory: services/sidecar
        run: uv run python packaging/smoke.py

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install JS dependencies
        run: npm ci

      - name: Build installer (electron-builder)
        working-directory: apps/desktop
        env:
          # No code-signing certificate yet: build unsigned.
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npm run dist:win

      # The afterPack hook (build/fuses.cjs) flips the fuses; fail the build if it did not run.
      - name: Verify Electron fuses
        working-directory: apps/desktop
        run: node build/fuses.cjs --check release/win-unpacked/ASCEND.exe

      - name: Upload installer
        uses: actions/upload-artifact@v7
        with:
          name: ascend-windows-installer-${{ github.ref_name }}-${{ github.sha }}
          path: apps/desktop/release/*.exe
          if-no-files-found: error
          retention-days: ${{ startsWith(github.ref, 'refs/tags/') && 90 || 14 }}

      - name: Publish GitHub Release (version tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" apps/desktop/release/*.exe \
            --repo "${{ github.repository }}" \
            --title "ASCEND ${{ github.ref_name }}" \
            --generate-notes \
            || gh release upload "${{ github.ref_name }}" apps/desktop/release/*.exe \
                 --repo "${{ github.repository }}" --clobber
