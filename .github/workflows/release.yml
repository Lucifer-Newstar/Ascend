# Windows installer build.
#
# Runs on a version tag (v0.1.0, ...), on every push to main that touches the app
# (so main always has an installable artefact), or manually from the Actions tab.
# Steps: build the sidecar with PyInstaller on Windows, build the renderer +
# Electron code, then electron-builder packs both into an NSIS installer.
#
# On a version tag the installer is also published to a GitHub Release (the CD
# step, job "publish"), so anyone can download ASCEND-Setup from the repo's Releases
# page. On main and manual runs it stays a workflow artifact (Actions -> run -> Artifacts).
#
# Permissions: the workflow token is read-only. Only the publish job, which runs on
# version tags alone and executes no repository code, gets contents: write.
name: Release (Windows installer)

on:
  push:
    tags: ["v*"]
    branches: [main]
    paths:
      - "apps/desktop/**"
      - "services/sidecar/**"
      - "packages/shared/**"
      - "package-lock.json"
      - ".github/workflows/release.yml"
  workflow_dispatch:

concurrency:
  group: installer-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

permissions:
  contents: read

jobs:
  windows-installer:
    strategy:
      matrix:
        os: [windows-latest]   # add windows-2022 etc. here to test more images
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          enable-cache: true
          cache-dependency-glob: services/sidecar/uv.lock

      - name: Build sidecar (PyInstaller)
        working-directory: services/sidecar
        run: |
          uv sync --frozen --group build
          uv run --group build pyinstaller packaging/ascend-sidecar.spec --noconfirm

      - name: Smoke test sidecar.exe
        working-directory: services/sidecar
        run: uv run python packaging/smoke.py

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - name: Install JS dependencies
        run: npm ci

      - name: Build installer (electron-builder)
        working-directory: apps/desktop
        env:
          # No code-signing certificate yet: build unsigned.
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npm run dist:win

      # The afterPack hook (build/fuses.cjs) flips the fuses; fail the build if it did not run.
      - name: Verify Electron fuses
        working-directory: apps/desktop
        run: node build/fuses.cjs --check release/win-unpacked/ASCEND.exe

      - name: Upload installer
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ascend-windows-installer-${{ github.ref_name }}-${{ github.sha }}
          path: apps/desktop/release/*.exe
          if-no-files-found: error
          retention-days: ${{ startsWith(github.ref, 'refs/tags/') && 90 || 14 }}

  publish:
    name: Publish GitHub Release
    needs: windows-installer
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write   # create the Release and upload the installer to it
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ascend-windows-installer-${{ github.ref_name }}-${{ github.sha }}
          path: installer

      - name: Create or update the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" installer/*.exe \
            --repo "${{ github.repository }}" \
            --title "ASCEND ${{ github.ref_name }}" \
            --generate-notes \
            || gh release upload "${{ github.ref_name }}" installer/*.exe \
                 --repo "${{ github.repository }}" --clobber
