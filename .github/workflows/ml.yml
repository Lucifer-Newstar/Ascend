# ML pipeline checks (owner: Navin, workflow: Gokul).
#
#   lint-test   -> ruff + pytest for ml/ (preprocessing contract, prepare rules, metrics,
#                  ONNX parity, intent data rules, coco converter, food gate) and the
#                  labels.json check against the food table
#   smoke       -> the food pipeline on the synthetic set: prepare -> train -> export ->
#                  evaluate -> gate (from scratch, so no weights download), then uploads
#                  metrics.json, the model manifest and the gate result
#   text-models -> nightly / by hand: rebuild the intent model and the knowledge base from
#                  their public sources and check both gates (needs the downloads)
#
# Only runs when ml/ or the food table changes (and nightly / by hand), because the
# torch install is the slowest thing in CI.
name: ML

on:
  push:
    branches: ["**"]
    paths:
      - "ml/**"
      - "services/sidecar/app/modules/nutrition/seed.py"
      - "services/sidecar/app/modules/nutrition/seed_v12.py"
      - "services/sidecar/app/modules/ml/**"
      - ".github/workflows/ml.yml"
  pull_request:
    branches: [main]
    paths:
      - "ml/**"
      - "services/sidecar/app/modules/nutrition/seed.py"
      - "services/sidecar/app/modules/nutrition/seed_v12.py"
      - "services/sidecar/app/modules/ml/**"
      - ".github/workflows/ml.yml"
  workflow_dispatch:
  schedule:
    - cron: "30 20 * * *"

concurrency:
  group: ml-${{ github.ref }}-${{ github.ref == 'refs/heads/main' && github.sha || 'latest' }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

env:
  # requirements.txt adds the PyTorch CPU index with --extra-index-url. uv's default
  # (first-index) takes every package that index carries from it alone, and it carries an
  # older pillow than requirements.txt asks for. unsafe-best-match picks the best version
  # across both indexes, which is what pip does; torch still resolves to the +cpu build.
  UV_INDEX_STRATEGY: unsafe-best-match

defaults:
  run:
    working-directory: ml

jobs:
  lint-test:
    name: ML lint + tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          enable-cache: true
          cache-dependency-glob: ml/requirements.txt
      - run: uv venv --python 3.12 .venv
      - run: uv pip install --python .venv/bin/python -r requirements.txt
      - name: Ruff
        run: uvx ruff@0.17.1 check . && uvx ruff@0.17.1 format --check .
      - name: Pytest
        run: .venv/bin/python -m pytest
      - name: Labels resolve to food rows
        run: .venv/bin/python src/check_labels.py

  smoke:
    name: Pipeline smoke run (synthetic data)
    needs: lint-test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      MLFLOW_DISABLE_AGENT_HINT: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          enable-cache: true
          cache-dependency-glob: ml/requirements.txt
      - run: uv venv --python 3.12 .venv
      - run: uv pip install --python .venv/bin/python -r requirements.txt
      - name: Generate synthetic data
        run: .venv/bin/python src/make_smoke_data.py --classes 4 --per-class 30 --own 5
      - name: Smoke recipe (no pretrained download, smoke version)
        # params.yaml holds the real recipe; the smoke run trains from scratch and is
        # labelled so the food gate can never pass it.
        run: |
          .venv/bin/python - <<'EOF'
          import yaml
          p = yaml.safe_load(open("params.yaml"))
          p["train"]["pretrained"] = False
          p["train"]["epochs"] = 15
          p["train"]["batch_size"] = 32
          p["export"]["version"] = "0.0.0-smoke"
          yaml.safe_dump(p, open("params.yaml", "w"), sort_keys=False)
          EOF
      - name: dvc repro (food stages)
        run: PATH="$PWD/.venv/bin:$PATH" dvc repro gate
      - name: Gate (smoke)
        # The synthetic classes are easy; anything under this means the pipeline broke.
        run: |
          .venv/bin/python - <<'EOF'
          import json
          m = json.load(open("metrics.json"))
          top1 = m["test"]["top1"]
          print(f"smoke top-1 {top1}")
          assert top1 >= 0.8, f"smoke top-1 {top1} < 0.8"
          gate = json.load(open("models/food-gate.json"))
          assert gate["passed"] is False, "a smoke model must never pass the food gate"
          EOF
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ml-smoke-${{ github.sha }}
          path: |
            ml/metrics.json
            ml/models/models-manifest.json
            ml/models/food-gate.json
            ml/reports/

  text-models:
    name: Intent model + knowledge base rebuild
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    needs: lint-test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      MLFLOW_DISABLE_AGENT_HINT: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          enable-cache: true
          cache-dependency-glob: ml/requirements.txt
      - run: uv venv --python 3.12 .venv
      - run: uv pip install --python .venv/bin/python -r requirements.txt
      - name: dvc repro (intent + knowledge)
        # Downloads the Stack Exchange dump, CLINC150, PAG 2018 and SR Legacy (about 60 MB),
        # trains the intent model (about a minute on CPU) and checks both gates.
        run: PATH="$PWD/.venv/bin:$PATH" dvc repro intent_evaluate kb_evaluate
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ml-text-models-${{ github.sha }}
          path: |
            ml/reports/intent_metrics.json
            ml/reports/kb_metrics.json
            ml/models/intent-manifest.json
