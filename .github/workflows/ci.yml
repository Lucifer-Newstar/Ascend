# Continuous integration: runs on every push and pull request.
#
# Jobs (independent ones run in parallel):
#   sidecar   -> ruff lint + format check, mypy, pytest (with coverage), Alembic upgrade check,
#                contract drift (OpenAPI vs docs/contracts)
#   desktop   -> eslint, tsc (renderer + Electron + shared), vitest, vite build
#   sidecar-build -> PyInstaller build on Linux + a smoke test of the binary
#   docker    -> builds the test image and runs the tests inside it
#
# The Windows installer lives in release.yml (it is slow, so it runs on tags / manually).
name: CI

on:
  # Every branch: feature branches get a run per push, main gets a run per merge.
  push:
    branches: ["**"]
    tags-ignore: ["v*"]      # tags are built by release.yml
  pull_request:
    branches: [main]
  # Run by hand from the Actions tab (any branch).
  workflow_dispatch:
  # Nightly at 20:30 UTC = 02:00 IST, catches breakage from new dependency releases.
  schedule:
    - cron: "30 20 * * *"

# Concurrency:
#   - pull requests and feature-branch pushes: a newer commit cancels the older run
#     (nobody needs results for a commit that has already been replaced);
#   - pushes to main: every commit keeps its own run (the group includes the SHA),
#     so main's history shows a result for each merge.
concurrency:
  group: ci-${{ github.ref }}-${{ github.ref == 'refs/heads/main' && github.sha || 'latest' }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  commits:
    name: Commit messages
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # commitlint needs the commits being checked
      - uses: wagoid/commitlint-github-action@v6
        with:
          configFile: commitlint.config.mjs

  sidecar:
    name: Sidecar (lint, types, tests) · ${{ matrix.os }}
    # The app ships on Windows, so tests run there too; Linux stays the fast signal.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      # Empty unless the repo defines the secret; the Codecov step is skipped then.
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
    defaults:
      run:
        working-directory: services/sidecar
    steps:
      - uses: actions/checkout@v4

      # uv installs Python 3.12 itself (from .python-version) and caches packages.
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: services/sidecar/uv.lock

      - name: Install dependencies (locked)
        run: uv sync --frozen

      - name: Lint (ruff)
        run: uv run ruff check .

      - name: Format check (ruff format)
        run: uv run ruff format --check .

      - name: Type check (mypy)
        run: uv run mypy app

      - name: Tests (pytest)
        run: uv run pytest --cov=app --cov-report=term-missing --cov-report=xml

      - name: Migrations apply to a fresh database
        shell: bash
        run: |
          export ASCEND_DB_URL="sqlite:///$(python -c 'import pathlib,os;print(pathlib.Path(os.environ["RUNNER_TEMP"]).as_posix())')/ci.db"
          uv run alembic upgrade head && uv run alembic current

      # The served OpenAPI must match docs/contracts (see docs/contracts/README.md §4).
      - name: Contract drift
        if: matrix.os == 'ubuntu-latest'
        run: uv run --with pyyaml python ../../scripts/check_contract_drift.py

      # Artifact names carry the OS and short SHA so downloads from different runs
      # and matrix legs never overwrite each other.
      - name: Short SHA
        id: sha
        shell: bash
        run: echo "short=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: sidecar-coverage-${{ matrix.os }}-${{ steps.sha.outputs.short }}
          path: services/sidecar/coverage.xml
          retention-days: 14

      # Optional: Codecov comments on PRs once the repo has a CODECOV_TOKEN secret.
      - name: Upload coverage to Codecov
        if: matrix.os == 'ubuntu-latest' && env.CODECOV_TOKEN != ''
        uses: codecov/codecov-action@v4
        with:
          files: services/sidecar/coverage.xml
          flags: sidecar
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Coverage summary
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          echo "### Sidecar coverage" >> "$GITHUB_STEP_SUMMARY"
          uv run coverage report --format=markdown >> "$GITHUB_STEP_SUMMARY"

  desktop:
    name: Desktop (lint, types, tests, build) · ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      # The Electron binary isn't needed to lint/test/build the renderer.
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install (npm workspaces, from package-lock.json)
        run: npm ci

      - name: Lint (eslint)
        run: npm run lint

      - name: Type check (tsc)
        run: npm run typecheck

      - name: Unit tests (vitest)
        run: npm test

      - name: Build renderer + Electron main/preload
        run: npm run build -w apps/desktop

      - name: Upload renderer build
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: renderer-dist-${{ github.sha }}
          path: apps/desktop/dist
          retention-days: 7

  sidecar-build:
    name: Sidecar binary (PyInstaller, Linux)
    runs-on: ubuntu-latest
    needs: sidecar
    defaults:
      run:
        working-directory: services/sidecar
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: services/sidecar/uv.lock

      - name: Build
        run: |
          uv sync --frozen --group build
          uv run --group build pyinstaller packaging/ascend-sidecar.spec --noconfirm

      # Start the binary with a token on stdin and check /health answers.
      - name: Smoke test
        run: |
          echo ci-token | ASCEND_PORT=8799 ASCEND_DATA_DIR="$RUNNER_TEMP/data" ./dist/ascend-sidecar/ascend-sidecar &
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:8799/health && exit 0
            sleep 1
          done
          echo "sidecar binary did not become healthy" && exit 1

  docker:
    name: Docker test image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and run tests in the container
        run: docker compose -f docker/docker-compose.yml run --rm --build sidecar-tests
